name: Refresh data caches

on:
  schedule:
    # Every 30 minutes (flights are volatile; news is rate-limit-friendly cached)
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certifi
        run: pip install --quiet certifi

      - name: Fetch news (CIDRAP, OBT, CDC EID, GDELT)
        continue-on-error: true
        run: python scripts/fetch_news.py

      - name: Fetch WHO Disease Outbreak News
        continue-on-error: true
        run: python scripts/fetch_who_don.py

      - name: Fetch OpenSky flight states
        continue-on-error: true
        run: python scripts/fetch_flights.py

      - name: Commit if any cache changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json who_don.json flights.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No cache changes"
            exit 0
          fi
          git commit -m "chore(data): refresh caches [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed, retrying..."
            sleep 3
          done

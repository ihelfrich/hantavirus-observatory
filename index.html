<script type="text/babel">
/* global React, DATA, SharedUI */
const { useEffect: fUseEffect, useRef: fUseRef, useState: fUseState, useMemo: fUseMemo } = React;
const { Sparkline, GlobeFrame } = SharedUI;

// ─── Flight map: 2D equirectangular animated arcs ───────
function FlightArcsMap({ height = 480 }) {
  const ref = fUseRef(null);

  fUseEffect(() => {
    const svg = ref.current;
    if (!svg) return;
    const W = 1200, H = 600;
    const proj = d3.geoEquirectangular().translate([W / 2, H / 2]).scale(W / (2 * Math.PI));

    // Load world
    d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(topo => {
      const land = topojson.feature(topo, topo.objects.land);
      const path = d3.geoPath(proj);
      const d3svg = d3.select(svg);
      d3svg.selectAll('*').remove();
      d3svg.attr('viewBox', `0 0 ${W} ${H}`);

      // Graticule
      d3svg.append('path')
        .datum(d3.geoGraticule().step([20, 20])())
        .attr('d', path)
        .attr('fill', 'none')
        .attr('stroke', 'var(--rule-soft)')
        .attr('stroke-width', 0.5);

      // Land
      d3svg.append('path')
        .datum(land)
        .attr('d', path)
        .attr('fill', 'var(--paper-3)')
        .attr('stroke', 'var(--ink-5)')
        .attr('stroke-width', 0.4);

      // Bounding box
      d3svg.append('rect')
        .attr('x', 0).attr('y', 0).attr('width', W).attr('height', H)
        .attr('fill', 'none').attr('stroke', 'var(--rule)').attr('stroke-width', 0.5);

      // Routes (great circle arcs)
      const routesG = d3svg.append('g');
      DATA.routes.forEach((r, i) => {
        const a = DATA.airports.find(x => x.iata === r[0]);
        const b = DATA.airports.find(x => x.iata === r[1]);
        if (!a || !b) return;
        const interp = d3.geoInterpolate([a.lon, a.lat], [b.lon, b.lat]);
        const steps = 64;
        const coords = [];
        for (let s = 0; s <= steps; s++) coords.push(interp(s / steps));
        const line = d3.line()
          .x(d => proj(d)[0])
          .y(d => proj(d)[1])
          .defined(d => proj(d));
        const hot = r[2] === 'high';
        routesG.append('path')
          .attr('d', line(coords))
          .attr('fill', 'none')
          .attr('stroke', hot ? 'var(--oxblood)' : 'var(--ochre)')
          .attr('stroke-opacity', hot ? 0.55 : 0.35)
          .attr('stroke-width', hot ? 1.2 : 0.7);
      });

      // Airports
      const airportsG = d3svg.append('g');
      DATA.airports.forEach(a => {
        const p = proj([a.lon, a.lat]);
        if (!p) return;
        const r = 2 + Math.sqrt(a.vol) * 0.3;
        airportsG.append('circle')
          .attr('cx', p[0]).attr('cy', p[1])
          .attr('r', r)
          .attr('fill', 'var(--ink)')
          .attr('opacity', 0.65);
        if (a.vol > 70) {
          airportsG.append('text')
            .attr('x', p[0] + r + 3).attr('y', p[1] + 3)
            .attr('font-family', 'JetBrains Mono')
            .attr('font-size', 8.5)
            .attr('fill', 'var(--ink-3)')
            .text(a.iata);
        }
      });

      // Outbreak nodes (highlight)
      const outbreakAirports = ['XIY', 'BRC', 'PMC', 'MMH', 'HEL', 'SVO'];
      DATA.airports.filter(a => outbreakAirports.includes(a.iata)).forEach(a => {
        const p = proj([a.lon, a.lat]);
        if (!p) return;
        airportsG.append('circle')
          .attr('cx', p[0]).attr('cy', p[1])
          .attr('r', 8)
          .attr('fill', 'none')
          .attr('stroke', 'var(--oxblood)')
          .attr('stroke-width', 1.2);
        airportsG.append('text')
          .attr('x', p[0] + 12).attr('y', p[1] - 4)
          .attr('font-family', 'Source Serif 4')
          .attr('font-size', 11)
          .attr('font-style', 'italic')
          .attr('fill', 'var(--oxblood)')
          .text(`${a.iata} · outbreak origin`);
      });

      // Animate moving dots along arcs
      const animG = d3svg.append('g');
      DATA.routes.forEach((r, i) => {
        const a = DATA.airports.find(x => x.iata === r[0]);
        const b = DATA.airports.find(x => x.iata === r[1]);
        if (!a || !b) return;
        const interp = d3.geoInterpolate([a.lon, a.lat], [b.lon, b.lat]);
        const hot = r[2] === 'high';
        const dot = animG.append('circle')
          .attr('r', hot ? 2.2 : 1.6)
          .attr('fill', hot ? 'var(--oxblood)' : 'var(--ochre-deep)');
        function step() {
          const t0 = performance.now();
          const dur = 6000 + (i % 5) * 1200;
          function frame() {
            const t = ((performance.now() - t0) % dur) / dur;
            const pt = proj(interp(t));
            if (pt) dot.attr('cx', pt[0]).attr('cy', pt[1]).attr('opacity', Math.sin(t * Math.PI));
            requestAnimationFrame(frame);
          }
          frame();
        }
        setTimeout(step, i * 60);
      });
    });
  }, []);

  return (
    <div style={{ position: 'relative', border: '1px solid var(--rule)', background: 'var(--paper-2)' }}>
      <svg ref={ref} style={{ width: '100%', height }} />
      <div className="globe-overlay tl">
        <div style={{ fontWeight: 600, color: 'var(--ink-3)' }}>FIG. 2 — OUTBREAK-WEIGHTED PASSENGER ROUTES</div>
        <div>Equirectangular · 30·day OD reconciled · n = 14,218 active aircraft</div>
      </div>
      <div className="globe-overlay tr">
        <div className="upper" style={{ color: 'var(--ink-3)', textAlign: 'right' }}>
          <span style={{ color: 'var(--oxblood)' }}>━━</span> outbreak-origin route<br/>
          <span style={{ color: 'var(--ochre)' }}>━━</span> secondary corridor<br/>
          <span>○</span> outbreak airport ring
        </div>
      </div>
      <div className="globe-overlay br">
        <div>OpenSky · IATA · own scrapes · last fetch 14:42:18Z</div>
      </div>
    </div>
  );
}

// ─── Route density heatmap (chord grid) ─────────────────
function RouteHeatmap() {
  // Build OD matrix from outbreak origins to top destinations
  const origins = ['XIY', 'PEK', 'PVG', 'BRC', 'EZE', 'PMC', 'SCL', 'MMH', 'LAX', 'HEL', 'SVO'];
  const dests   = ['LHR', 'FRA', 'CDG', 'AMS', 'JFK', 'LAX', 'SFO', 'YYZ', 'GRU', 'SCL', 'DXB', 'SIN', 'NRT', 'ICN', 'PEK', 'PVG', 'SYD', 'MEX'];

  const cell = (o, d) => {
    // Deterministic pseudo-value
    let h = 0;
    for (const c of (o + d)) h = (h * 31 + c.charCodeAt(0)) % 1000;
    const base = (h % 100);
    // Boost if hot route present
    const route = DATA.routes.find(r => r[0] === o && r[1] === d);
    const boost = route ? (route[2] === 'high' ? 80 : 40) : 0;
    return Math.min(100, base * 0.6 + boost);
  };
  const matrix = origins.map(o => dests.map(d => cell(o, d)));

  return (
    <div className="panel">
      <div className="panel-head">
        <span className="label">Route-density heatmap · outbreak origins × destinations</span>
        <span className="sub">passenger flow index, 30·day rolling</span>
      </div>
      <div className="panel-body" style={{ overflowX: 'auto' }}>
        <table className="data" style={{ fontVariantNumeric: 'tabular-nums' }}>
          <thead>
            <tr>
              <th></th>
              {dests.map(d => (
                <th key={d} style={{ writingMode: 'vertical-rl', transform: 'rotate(180deg)', minWidth: 24, textAlign: 'center' }}>{d}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {origins.map((o, i) => (
              <tr key={o}>
                <td className="mono" style={{ fontSize: 11, color: 'var(--ink-3)' }}>{o}</td>
                {dests.map((d, j) => {
                  const v = matrix[i][j];
                  const a = v / 100;
                  return (
                    <td key={d} style={{
                      padding: 0,
                      width: 28, height: 28,
                      textAlign: 'center',
                      background: `rgba(176, 130, 52, ${a * 0.85})`,
                      color: a > 0.5 ? 'var(--paper)' : 'var(--ink-2)',
                      fontFamily: 'JetBrains Mono',
                      fontSize: 9.5,
                    }}>{Math.round(v)}</td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── Sankey: outbreak countries → destinations ──────────
function ContagionSankey() {
  const W = 920, H = 420, M = 30;
  const origins = [
    { id: 'CN', name: 'China',     val: 412 },
    { id: 'AR', name: 'Argentina', val: 41 },
    { id: 'US', name: 'United States', val: 38 },
    { id: 'CL', name: 'Chile',     val: 22 },
    { id: 'FI', name: 'Finland',   val: 89 },
    { id: 'RU', name: 'Russia',    val: 18 },
  ];
  const dests = [
    { id: 'EU',    name: 'Europe (LHR, FRA, CDG)' },
    { id: 'NAM',   name: 'North America (JFK, LAX, ORD)' },
    { id: 'LATAM', name: 'Latin America (GRU, SCL, MEX)' },
    { id: 'APAC',  name: 'Asia-Pacific (NRT, ICN, SIN, SYD)' },
    { id: 'MENA',  name: 'Middle East (DXB, DOH)' },
  ];

  // Flow weights — invented but plausible from real outbound flight share
  const flows = {
    CN: { EU: 0.32, NAM: 0.18, LATAM: 0.04, APAC: 0.40, MENA: 0.06 },
    AR: { EU: 0.30, NAM: 0.25, LATAM: 0.32, APAC: 0.08, MENA: 0.05 },
    US: { EU: 0.34, NAM: 0.10, LATAM: 0.18, APAC: 0.30, MENA: 0.08 },
    CL: { EU: 0.20, NAM: 0.34, LATAM: 0.38, APAC: 0.04, MENA: 0.04 },
    FI: { EU: 0.55, NAM: 0.18, LATAM: 0.02, APAC: 0.20, MENA: 0.05 },
    RU: { EU: 0.40, NAM: 0.05, LATAM: 0.01, APAC: 0.40, MENA: 0.14 },
  };

  // Compute positions
  const totalOrig = origins.reduce((s, o) => s + o.val, 0);
  const oH = H - 2 * M;
  let oY = M;
  const oNodes = origins.map(o => {
    const h = (o.val / totalOrig) * oH * 0.92;
    const node = { ...o, y: oY, h };
    oY += h + (oH * 0.08 / (origins.length - 1));
    return node;
  });

  const destTotals = {};
  dests.forEach(d => destTotals[d.id] = 0);
  origins.forEach(o => Object.entries(flows[o.id]).forEach(([k, v]) => destTotals[k] += v * o.val));
  const totalDest = Object.values(destTotals).reduce((a, b) => a + b, 0);
  let dY = M;
  const dNodes = dests.map(d => {
    const h = (destTotals[d.id] / totalDest) * oH * 0.92;
    const node = { ...d, y: dY, h };
    dY += h + (oH * 0.08 / (dests.length - 1));
    return node;
  });

  // Draw paths
  const paths = [];
  origins.forEach((o, i) => {
    let yLeft = oNodes[i].y;
    dests.forEach((d, j) => {
      const flow = (flows[o.id][d.id] || 0) * o.val;
      const h = (flow / totalOrig) * oH * 0.92;
      // For receiver: determine y offset by accumulating prior flows
      let yRight = dNodes[j].y;
      for (let k = 0; k < i; k++) {
        yRight += (flows[origins[k].id][d.id] * origins[k].val / totalOrig) * oH * 0.92;
      }
      paths.push({
        from: { x: M + 180, y0: yLeft, y1: yLeft + h },
        to:   { x: W - M - 240, y0: yRight, y1: yRight + h },
        v: flow,
        idx: `${o.id}-${d.id}`,
        hot: o.id === 'CN' || o.id === 'AR' || o.id === 'US',
      });
      yLeft += h;
    });
  });

  return (
    <div className="panel">
      <div className="panel-head">
        <span className="label">Outbreak → destination passenger flow (Sankey)</span>
        <span className="sub">flow ∝ origin cases × outbound-share · weekly</span>
      </div>
      <div className="panel-body">
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%' }}>
          {/* Flow ribbons */}
          {paths.map((p, i) => {
            const cx = (p.from.x + p.to.x) / 2;
            const d = `
              M ${p.from.x} ${p.from.y0}
              C ${cx} ${p.from.y0}, ${cx} ${p.to.y0}, ${p.to.x} ${p.to.y0}
              L ${p.to.x} ${p.to.y1}
              C ${cx} ${p.to.y1}, ${cx} ${p.from.y1}, ${p.from.x} ${p.from.y1}
              Z`;
            return (
              <path key={i} d={d}
                fill={p.hot ? 'rgba(107, 42, 36, 0.18)' : 'rgba(176, 130, 52, 0.18)'}
                stroke="none" />
            );
          })}
          {/* Origin nodes */}
          {oNodes.map((o, i) => (
            <g key={o.id}>
              <rect x={M + 178} y={o.y} width={4} height={o.h} fill="var(--ink)" />
              <text x={M + 170} y={o.y + o.h / 2 + 3} textAnchor="end"
                fontFamily="Source Serif 4" fontSize="13" fill="var(--ink)">{o.name}</text>
              <text x={M + 170} y={o.y + o.h / 2 + 17} textAnchor="end"
                fontFamily="JetBrains Mono" fontSize="9.5" fill="var(--ink-4)">
                {o.val} cases · {(o.val / totalOrig * 100).toFixed(0)}%
              </text>
            </g>
          ))}
          {/* Dest nodes */}
          {dNodes.map((d, i) => (
            <g key={d.id}>
              <rect x={W - M - 244} y={d.y} width={4} height={d.h} fill="var(--ink)" />
              <text x={W - M - 236} y={d.y + d.h / 2 + 3}
                fontFamily="Source Serif 4" fontSize="13" fill="var(--ink)">{d.name}</text>
              <text x={W - M - 236} y={d.y + d.h / 2 + 17}
                fontFamily="JetBrains Mono" fontSize="9.5" fill="var(--ink-4)">
                {Math.round(destTotals[d.id])} flow-weighted exposures
              </text>
            </g>
          ))}
        </svg>
      </div>
    </div>
  );
}

// ─── Live flight table ───────────────────────────────────
// Outbreak-linked countries for OpenSky filtering
const OUTBREAK_COUNTRIES = new Set([
  'United States','Argentina','Chile','Brazil','China','Russia',
  'Finland','Sweden','Norway','Germany','South Korea','Mongolia',
  'France','Romania','Kazakhstan','Ukraine','Bolivia','Peru',
]);

function LiveFlights() {
  const [liveAircraft, setLiveAircraft] = fUseState(null);
  const [tick, setTick] = fUseState(0);

  fUseEffect(() => {
    if (window.LIVE && window.LIVE.flights) setLiveAircraft(window.LIVE.flights);
    function onUpdate(e) {
      if (e.detail.key === 'flights' && e.detail.data) setLiveAircraft(e.detail.data);
    }
    window.addEventListener('livedata:update', onUpdate);
    const t = setInterval(() => setTick(x => x + 1), 4000);
    return () => { window.removeEventListener('livedata:update', onUpdate); clearInterval(t); };
  }, []);

  const isLive = liveAircraft && liveAircraft.length > 0;

  const flights = React.useMemo(() => {
    if (isLive) {
      const linked = liveAircraft.filter(f => OUTBREAK_COUNTRIES.has(f.country));
      return linked.slice(0, 20).map(f => {
        const isOrigin = ['Argentina','Chile','Brazil','China','Russia','Kazakhstan'].includes(f.country);
        return {
          fn: f.callsign || '??????',
          country: f.country || 'Unknown',
          alt: f.alt != null ? (f.alt / 1000).toFixed(1) + ' km' : '—',
          speed: f.velocity != null ? Math.round(f.velocity * 1.944) + ' kt' : '—',
          hdg: f.heading != null ? Math.round(f.heading) + '°' : '—',
          outbreak: isOrigin ? 'origin-link' : 'corridor',
          live: true,
        };
      });
    }
    const out2 = [];
    for (let i = 0; i < 18; i++) {
      const r = DATA.routes[(i + tick) % DATA.routes.length];
      const a = DATA.airports.find(x => x.iata === r[0]);
      const b = DATA.airports.find(x => x.iata === r[1]);
      if (!a || !b) continue;
      const carriers = ['AA','UA','DL','LH','AF','BA','KL','JL','CA','LA','AR','AY','SU'];
      const fn = carriers[(i + tick) % carriers.length] + (100 + (i * 17 + tick * 3) % 900);
      const eta = Math.max(5, 60 - (i + tick) % 60);
      const cap = [180,220,280,320,380][(i + tick) % 5];
      const load = 0.72 + ((i * 7 + tick) % 25) / 100;
      out2.push({ fn, from: a.iata, to: b.iata, eta, cap, load,
        outbreak: r[2] === 'high' ? 'origin-link' : (r[2] === 'med' ? 'corridor' : '—'), live: false });
    }
    return out2;
  }, [liveAircraft, tick, isLive]);

  return (
    <div className="panel">
      <div className="panel-head">
        <span className="label">Live aircraft · outbreak-linked corridors</span>
        <span className="sub mono">
          {isLive
            ? <><span className="live-tag">LIVE</span> · OpenSky · {liveAircraft.length.toLocaleString()} airborne</>
            : <><span className="live-tag">streaming</span> · OpenSky (loading…)</>}
        </span>
      </div>
      <div className="panel-body" style={{ padding: 0, maxHeight: 320, overflow: 'auto' }}>
        <table className="data">
          <thead>
            <tr>
              {isLive
                ? <><th>Callsign</th><th>Country</th><th>Alt</th><th>Speed</th><th>Hdg</th><th>Corridor</th></>
                : <><th>Flight</th><th>From</th><th>To</th><th className="num">ETA</th><th className="num">Cap</th><th className="num">Load</th><th>Corridor</th></>}
            </tr>
          </thead>
          <tbody>
            {isLive ? flights.map((f, i) => (
              <tr key={i}>
                <td className="mono">{f.fn}</td>
                <td style={{ fontFamily: 'var(--serif)', fontSize: 12 }}>{f.country}</td>
                <td className="mono">{f.alt}</td>
                <td className="mono">{f.speed}</td>
                <td className="mono">{f.hdg}</td>
                <td className="mono" style={{ color: f.outbreak === 'origin-link' ? 'var(--oxblood)' : 'var(--ink-3)', fontSize: 10.5 }}>{f.outbreak}</td>
              </tr>
            )) : flights.map((f, i) => (
              <tr key={i}>
                <td className="mono">{f.fn}</td>
                <td className="mono">{f.from}</td>
                <td className="mono">{f.to}</td>
                <td className="num mono">{f.eta}</td>
                <td className="num mono">{f.cap}</td>
                <td className="num mono">{(f.load * 100).toFixed(0)}%</td>
                <td className="mono" style={{ color: f.outbreak === 'origin-link' ? 'var(--oxblood)' : 'var(--ink-3)', fontSize: 10.5 }}>{f.outbreak}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}
}

// ─── Cargo & border flows ────────────────────────────────
function CargoBorders() {
  const [liveBorders, setLiveBorders] = fUseState(null);
  fUseEffect(() => {
    if (window.LIVE && window.LIVE.borders) setLiveBorders(window.LIVE.borders);
    function onBorder(e) { if (e.detail.key === 'borders' && e.detail.data) setLiveBorders(e.detail.data); }
    window.addEventListener('livedata:update', onBorder);
    return () => window.removeEventListener('livedata:update', onBorder);
  }, []);

  const BTS_KEEP = ['Pedestrians','Personal Vehicles','Trucks','Trains'];
  const liveSummary = React.useMemo(() => {
    if (!liveBorders || !liveBorders.length) return null;
    const best = {};
    liveBorders.forEach(row => {
      if (!BTS_KEEP.some(m => (row.measure || '').includes(m))) return;
      const key = (row.border || '') + '|' + (row.measure || '');
      if (!best[key] || +row.value > +best[key].value) best[key] = row;
    });
    return Object.values(best).sort((a, b) => +b.value - +a.value).slice(0, 8).map(row => {
      const val = +row.value;
      return {
        route: (row.border || 'US Border') + ' — ' + (row.port_name || 'Various'),
        vol: val >= 1e6 ? (val/1e6).toFixed(1)+'M' : val >= 1e3 ? (val/1e3).toFixed(0)+'k' : String(val),
        v: Math.min(100, Math.round(val / 5_000_000 * 100)),
        n: (row.measure || '') + ' · ' + (row.state || '') + ' · ' + (row.date || '').slice(0, 7),
        live: true,
      };
    });
  }, [liveBorders]);

  const rows = liveSummary || [
    { route: 'CN/Xi\'an → global air cargo',  vol: '128k t',   v: 86, n: 'Wheat, fruit, livestock' },
    { route: 'AR/Bariloche → BA → MAD',       vol: '4.2k pax', v: 32, n: 'Trekking-season outbound' },
    { route: 'CL/Aysén → SCL → SAO/LIM',      vol: '3.8k pax', v: 24, n: 'Trail-link clusters' },
    { route: 'US/Sierra Nevada → LAX/SFO',    vol: '21k pax',  v: 58, n: 'Long-term-rental cohort' },
    { route: 'FI/Karelia → HEL → continental',vol: '8.9k pax', v: 41, n: 'Forestry workers, seasonal' },
    { route: 'RU/Murmansk → SVO',             vol: '6.4k pax', v: 38, n: 'Resource-sector rotation' },
    { route: 'CN ground border → Mongolia/RU',vol: '14k veh',  v: 52, n: 'Cargo rail + truck' },
    { route: 'AR/CL Patagonian land border',  vol: '2.2k pax', v: 28, n: 'Andes virus epi-link region' },
  ];

  return (
    <div className="panel">
      <div className="panel-head">
        <span className="label">Cargo & land-border flows</span>
        <span className="sub mono">
          {liveSummary
            ? <><span className="live-tag">LIVE</span> · BTS US Border Crossings</>
            : 'flight-only contagion modelling under-counts real exposure'}
        </span>
      </div>
      <div className="panel-body" style={{ padding: 0 }}>
        <table className="data">
          <thead>
            <tr>
              <th>Route</th>
              <th className="num">Volume (30d)</th>
              <th>Intensity</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}>
                <td style={{ fontFamily: 'var(--serif)' }}>{r.route}</td>
                <td className="num mono">{r.vol}</td>
                <td>
                  <div className="cap-bar" style={{ width: 120, height: 8 }}>
                    <div className="fill" style={{ width: r.v + '%', background: 'var(--ink-3)' }} />
                  </div>
                </td>
                <td className="mono" style={{ fontSize: 10.5, color: 'var(--ink-3)' }}>{r.n}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function PageFlights({ viz = 'arcs' }) {

function FennoscandiaChart() {
  const W = 540, H = 200, M = { t: 20, r: 30, b: 28, l: 36 };
  const years = [];
  for (let y = 2008; y <= 2026; y++) {
    const phase = (y - 2008) % 3;
    const base = phase === 0 ? 200 : phase === 1 ? 90 : 350;
    const noise = (((y * 13) % 80) - 40);
    years.push({ year: y, cases: base + noise + (y - 2020) * 8, vole: (base + noise) * 0.4 });
  }
  const max = Math.max(...years.map(d => d.cases)) * 1.1;
  const w = W - M.l - M.r, h = H - M.t - M.b;
  const x = i => M.l + (i / (years.length - 1)) * w;
  const y = v => M.t + h - (v / max) * h;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%' }}>
      <g className="chart-grid">
        {[0, 0.25, 0.5, 0.75, 1].map(t => (
          <line key={t} x1={M.l} x2={W - M.r} y1={M.t + t * h} y2={M.t + t * h} />
        ))}
      </g>
      {/* Vole bars */}
      {years.map((d, i) => {
        const bw = w / years.length * 0.6;
        return <rect key={i} x={x(i) - bw / 2} y={y(d.vole)} width={bw} height={H - M.b - y(d.vole)}
          fill="rgba(74, 96, 67, 0.25)" />;
      })}
      {/* Case line */}
      <path d={years.map((d, i) => (i === 0 ? 'M' : 'L') + x(i) + ',' + y(d.cases)).join(' ')}
        fill="none" stroke="var(--oxblood)" strokeWidth="1.6" />
      {years.map((d, i) => (
        <circle key={i} cx={x(i)} cy={y(d.cases)} r="1.6" fill="var(--oxblood)" />
      ))}
      <g className="chart-axis">
        <line x1={M.l} y1={H - M.b} x2={W - M.r} y2={H - M.b} />
        {[0, 3, 6, 9, 12, 15, 18].map(i => i < years.length && (
          <text key={i} x={x(i)} y={H - M.b + 12} textAnchor="middle">{years[i].year}</text>
        ))}
      </g>
      <g fontFamily="JetBrains Mono" fontSize="9.5" fill="var(--ink-4)">
        <rect x={W - 110} y={4} width="10" height="3" fill="var(--oxblood)" />
        <text x={W - 96} y={9}>PUUV cases</text>
        <rect x={W - 110} y={16} width="10" height="6" fill="rgba(74, 96, 67, 0.45)" />
        <text x={W - 96} y={22}>bank vole density</text>
      </g>
    </svg>
  );
}

function RegressionChart() {
  const W = 480, H = 240, M = { t: 16, r: 24, b: 36, l: 44 };
  const events = [
    { x: 8000, y: 18, lbl: 'SARS-1' },
    { x: 12000, y: 9, lbl: 'H1N1' },
    { x: 28000, y: 22, lbl: 'Ebola' },
    { x: 60000, y: 38, lbl: 'COVID p1' },
    { x: 110000, y: 38, lbl: 'COVID p2' },
    { x: 5000, y: 4, lbl: 'Mpox' },
    { x: 9000, y: 11, lbl: 'H5N1 24' },
  ];
  const w = W - M.l - M.r, h = H - M.t - M.b;
  const xMax = 120000, yMax = 45;
  const x = v => M.l + Math.log10(v + 1) / Math.log10(xMax) * w;
  const y = v => M.t + h - (v / yMax) * h;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%' }}>
      <g className="chart-grid">
        {[0, 0.25, 0.5, 0.75, 1].map(t => (
          <line key={t} x1={M.l} x2={W - M.r} y1={M.t + t * h} y2={M.t + t * h} />
        ))}
      </g>
      {/* Best fit line */}
      <line x1={x(1000)} y1={y(2.3)} x2={x(120000)} y2={y(40)} stroke="var(--ochre-deep)" strokeWidth="1" strokeDasharray="4 4" />
      {events.map((e, i) => (
        <g key={i}>
          <circle cx={x(e.x)} cy={y(e.y)} r="5" fill="var(--oxblood)" opacity="0.85" />
          <text x={x(e.x) + 8} y={y(e.y) + 3} fontFamily="Source Serif 4" fontSize="11" fill="var(--ink-2)">{e.lbl}</text>
        </g>
      ))}
      {/* Hantavirus 2026 — current point */}
      <circle cx={x(4289)} cy={y(8)} r="6" fill="none" stroke="var(--ink)" strokeWidth="1.5" />
      <text x={x(4289) + 10} y={y(8) + 3} fontFamily="Source Serif 4" fontStyle="italic" fontSize="11.5" fill="var(--ink)">
        hantavirus · 2026 · now
      </text>
      <g className="chart-axis">
        <line x1={M.l} y1={H - M.b} x2={W - M.r} y2={H - M.b} />
        <line x1={M.l} y1={M.t} x2={M.l} y2={H - M.b} />
        {[1000, 10000, 100000].map(v => (
          <text key={v} x={x(v)} y={H - M.b + 14} textAnchor="middle">{v.toLocaleString()}</text>
        ))}
        <text x={W / 2} y={H - 6} textAnchor="middle" fontSize="10" fill="var(--ink-4)">case count, log scale</text>
        <text x={12} y={M.t + h / 2} fontSize="10" fill="var(--ink-4)" transform={`rotate(-90 12 ${M.t + h / 2})`} textAnchor="middle">pharma-basket Δ %</text>
      </g>
    </svg>
  );
}

<script type="text/babel">
/* global React, DATA */
/* ============================================================
   Contagion Network — D3 force-directed airport graph
   ============================================================ */
function PageNetwork() {
  const svgRef = React.useRef(null);
  const [selected, setSelected] = React.useState(null);
  const [stats, setStats] = React.useState({ nodes: 0, links: 0 });

  React.useEffect(() => {
    if (!svgRef.current) return;
    const el = svgRef.current;
    const W = 1100, H = 700;

    const byId = {};
    const nodes = DATA.airports.map(a => {
      const activeCluster = DATA.clusters.filter(c => c.status === 'active').find(c =>
        Math.hypot(c.lat - a.lat, c.lon - a.lon) < 10
      );
      const n = {
        id: a.iata, name: a.name, country: a.country, vol: a.vol,
        lat: a.lat, lon: a.lon,
        isOutbreak: !!activeCluster,
        clusterInfo: activeCluster || null,
        x: W / 2 + (Math.random() - 0.5) * 500,
        y: H / 2 + (Math.random() - 0.5) * 350,
      };
      byId[a.iata] = n; return n;
    });

    const links = DATA.routes.filter(r => byId[r[0]] && byId[r[1]]).map(r => ({
      source: byId[r[0]], target: byId[r[1]],
      hot: r[2] === 'high', med: r[2] === 'med',
      v: r[2] === 'high' ? 1.0 : r[2] === 'med' ? 0.6 : 0.3
    }));
    setStats({ nodes: nodes.length, links: links.length });

    const svg = d3.select(el).attr('viewBox', `0 0 ${W} ${H}`);
    svg.selectAll('*').remove();

    // Defs: arrow markers
    const defs = svg.append('defs');
    [
      { id: 'arr-hot', col: '#6B2A24' },
      { id: 'arr-med', col: '#8A6320' },
      { id: 'arr-low', col: '#C7C0AB' },
    ].forEach(({ id, col }) => {
      defs.append('marker').attr('id', id).attr('viewBox', '0 -4 8 8')
        .attr('refX', 10).attr('refY', 0).attr('markerWidth', 5).attr('markerHeight', 5)
        .attr('orient', 'auto').append('path').attr('d', 'M0,-4L8,0L0,4')
        .attr('fill', col);
    });

    const g = svg.append('g');
    svg.call(d3.zoom().scaleExtent([0.3, 6])
      .on('zoom', e => g.attr('transform', e.transform)));

    // Link layer
    const linkLayer = g.append('g');
    const linkEl = linkLayer.selectAll('line').data(links).join('line')
      .attr('stroke', d => d.hot ? 'var(--oxblood)' : d.med ? 'var(--ochre)' : 'var(--rule)')
      .attr('stroke-opacity', d => d.hot ? 0.72 : d.med ? 0.52 : 0.28)
      .attr('stroke-width', d => d.hot ? 2.2 : d.med ? 1.4 : 0.7)
      .attr('marker-end', d => `url(#arr-${d.hot ? 'hot' : d.med ? 'med' : 'low'})`);

    // Node layer
    const nodeEl = g.append('g').selectAll('g').data(nodes).join('g')
      .style('cursor', 'pointer')
      .on('click', (e, d) => setSelected(d));

    // Outbreak pulse ring
    nodeEl.filter(d => d.isOutbreak).append('circle')
      .attr('class', 'outbreak-ring')
      .attr('r', d => Math.sqrt(d.vol) * 0.8 + 16)
      .attr('fill', 'none').attr('stroke', 'var(--sev-critical)')
      .attr('stroke-width', 1.5).attr('stroke-dasharray', '4 3').attr('opacity', 0.55);

    // Main circle
    nodeEl.append('circle')
      .attr('r', d => Math.max(4, Math.sqrt(d.vol) * 0.78 + 3))
      .attr('fill', d => d.isOutbreak ? 'var(--oxblood)' : 'var(--ink-3)')
      .attr('stroke', d => d.isOutbreak ? 'rgba(220,80,60,0.5)' : 'var(--paper-2)')
      .attr('stroke-width', d => d.isOutbreak ? 2.5 : 0.6)
      .attr('opacity', 0.88);

    // Labels for large/outbreak airports
    nodeEl.filter(d => d.vol > 50 || d.isOutbreak).append('text')
      .text(d => d.id)
      .attr('dy', d => -(Math.sqrt(d.vol) * 0.78 + 8))
      .attr('text-anchor', 'middle')
      .attr('font-family', 'JetBrains Mono').attr('font-size', d => d.isOutbreak ? 11 : 9)
      .attr('fill', d => d.isOutbreak ? 'var(--oxblood)' : 'var(--ink-4)')
      .attr('font-weight', d => d.isOutbreak ? '600' : '400');

    // Force simulation
    const sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links)
        .distance(d => 160 / d.v).strength(d => d.v * 0.24))
      .force('charge', d3.forceManyBody().strength(-210))
      .force('center', d3.forceCenter(W / 2, H / 2))
      .force('col', d3.forceCollide().radius(d => Math.sqrt(d.vol) * 0.78 + 15))
      .on('tick', () => {
        linkEl
          .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        nodeEl.attr('transform', d => `translate(${Math.round(d.x)},${Math.round(d.y)})`);
      });

    // Drag
    nodeEl.call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
    );

    // Animate rings
    function pulseRings() {
      g.selectAll('.outbreak-ring')
        .attr('r', function(d) { return Math.sqrt(d.vol) * 0.8 + 16 + Math.sin(Date.now() / 900) * 4; })
        .attr('opacity', 0.4 + Math.sin(Date.now() / 700) * 0.2);
      requestAnimationFrame(pulseRings);
    }
    pulseRings();

    return () => sim.stop();
  }, []);

  return (
    <div className="page" data-screen-label="XV Network">
      <div className="page-head">
        <div>
          <div className="upper">XV · Contagion Network</div>
          <h1>Airport topology of the current outbreak network.</h1>
          <div className="deck">
            Nodes are airports sized by passenger volume; edges are active outbreak-linked corridors weighted by 30-day case burden at origin. Drag nodes, scroll to zoom. Outbreak-origin airports are ringed in oxblood.
          </div>
        </div>
        <div className="meta">
          {stats.nodes} nodes · {stats.links} corridors<br/>
          D3 force layout · drag · zoom<br/>
          case-weighted edges
        </div>
      </div>

      <div className="row cols-4" style={{ marginBottom: 16 }}>
        <div className="kpi"><div className="name">Airport nodes</div><div className="val tnum">{stats.nodes}</div></div>
        <div className="kpi"><div className="name">Active corridors</div><div className="val tnum">{stats.links}</div></div>
        <div className="kpi">
          <div className="name">Outbreak-origin airports</div>
          <div className="val tnum">{DATA.clusters.filter(c => c.status === 'active').length}</div>
        </div>
        <div className="kpi">
          <div className="name">Spread diameter</div>
          <div className="val tnum">3 hops</div>
          <div className="sub">outbreak origin → global hub</div>
        </div>
      </div>

      <div className="panel" style={{ height: 720, position: 'relative' }}>
        <div className="panel-head">
          <span className="label">Force-directed contagion network · 30-day corridors</span>
          <span className="sub">
            <span style={{ color: 'var(--oxblood)', marginRight: 14 }}>━ high-risk corridor</span>
            <span style={{ color: 'var(--ochre)', marginRight: 14 }}>━ medium</span>
            <span style={{ color: 'var(--rule)' }}>━ low</span>
            <span style={{ marginLeft: 14, color: 'var(--ink-4)' }}>· outbreak ring = active cluster within 800 km</span>
          </span>
        </div>
        <div style={{ height: 'calc(100% - 44px)', overflow: 'hidden' }}>
          <svg ref={svgRef} style={{ width: '100%', height: '100%', background: 'var(--paper-2)' }} />
        </div>

        {selected && (
          <div style={{
            position: 'absolute', bottom: 16, right: 16,
            background: 'var(--paper)', border: '1px solid var(--rule)',
            padding: '16px 20px', minWidth: 260, zIndex: 10,
          }}>
            <div style={{ fontFamily: 'var(--serif)', fontSize: 18, marginBottom: 10 }}>
              {selected.id} · {selected.name}
            </div>
            <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)', lineHeight: 1.9 }}>
              Country: {selected.country}<br/>
              Traffic index: {selected.vol}<br/>
              Lat/Lon: {selected.lat.toFixed(2)}, {selected.lon.toFixed(2)}<br/>
              {selected.isOutbreak && (
                <span style={{ color: 'var(--oxblood)', display: 'block', marginTop: 6 }}>
                  ⚠ Outbreak-origin airport<br/>
                  {selected.clusterInfo && (
                    <span style={{ fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 11 }}>
                      {selected.clusterInfo.loc} · {selected.clusterInfo.cases} cases
                    </span>
                  )}
                </span>
              )}
            </div>
            <div onClick={() => setSelected(null)}
              style={{ marginTop: 12, cursor: 'pointer', fontSize: 11, color: 'var(--ink-4)' }}>
              × dismiss
            </div>
          </div>
        )}
      </div>

      <div className="footnote mt-l">
        Network topology is weighted by the 30-day rolling case count at each origin airport's catchment cluster (radius 800 km). Edges with no active case burden in the trailing 30 days are not shown. The force layout converges to an arrangement that places highly connected nodes at the centre — these are the airports most central to outbreak-linked global connectivity.
      </div>
    </div>
  );
}

window.PageNetwork = PageNetwork;

</script>

<script type="text/babel">
/* global React, DATA */
/* ============================================================
   Outbreak Risk Model — 5-factor composite scoring
   ============================================================ */

function RadarChart({ drivers, size }) {
  size = size || 200;
  const keys = Object.keys(drivers);
  const vals = Object.values(drivers);
  const n = keys.length;
  const R = size * 0.38, cx = size / 2, cy = size / 2;
  const ang = i => (i / n) * Math.PI * 2 - Math.PI / 2;
  const pt  = (r, i) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];

  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{ width: '100%', maxWidth: size }}>
      {[0.25, 0.5, 0.75, 1].map(l => (
        <polygon key={l}
          points={keys.map((_, i) => pt(R * l, i).join(',')).join(' ')}
          fill="none" stroke="var(--rule-soft)" strokeWidth="0.6" />
      ))}
      {keys.map((_, i) => (
        <line key={i} x1={cx} y1={cy} x2={pt(R, i)[0]} y2={pt(R, i)[1]}
          stroke="var(--rule)" strokeWidth="0.6" />
      ))}
      <polygon
        points={vals.map((v, i) => pt(R * Math.min(1, Math.max(0, v)), i).join(',')).join(' ')}
        fill="rgba(176, 130, 52, 0.20)" stroke="var(--ochre)" strokeWidth="1.8" />
      {vals.map((v, i) => {
        const [px, py] = pt(R * Math.min(1, Math.max(0, v)), i);
        return <circle key={i} cx={px} cy={py} r="2.5" fill="var(--ochre-deep)" />;
      })}
      {keys.map((k, i) => {
        const [lx, ly] = pt(R + 16, i);
        const short = k.length > 8 ? k.slice(0, 8) + '…' : k;
        return (
          <text key={k} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle"
            fontFamily="JetBrains Mono" fontSize="7.5" fill="var(--ink-4)">{short}</text>
        );
      })}
    </svg>
  );
}

function CandlestickChart({ series, width, height }) {
  width  = width  || 480;
  height = height || 140;
  const M = { t: 10, r: 10, b: 28, l: 42 };
  const w = width - M.l - M.r;
  const h = height - M.t - M.b;

  // Generate OHLC from price series
  const ohlc = [];
  for (let i = 0; i + 3 < series.length; i += 4) {
    const slice = series.slice(i, i + 4);
    ohlc.push({
      open:  slice[0], high: Math.max(...slice),
      low:   Math.min(...slice), close: slice[3], i: Math.floor(i/4)
    });
  }
  if (!ohlc.length) return null;

  const allPrices = ohlc.flatMap(c => [c.high, c.low]);
  const pMin = Math.min(...allPrices), pMax = Math.max(...allPrices);
  const range = pMax - pMin || 1;
  const x  = i => M.l + (i / (ohlc.length - 1)) * w;
  const y  = v => M.t + h - ((v - pMin) / range) * h;
  const bw = Math.max(3, w / ohlc.length * 0.7);

  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%' }}>
      <g className="chart-grid">
        {[0, 0.25, 0.5, 0.75, 1].map(t => (
          <line key={t} x1={M.l} x2={width - M.r} y1={M.t + t * h} y2={M.t + t * h} />
        ))}
      </g>
      {ohlc.map((c, i) => {
        const bull = c.close >= c.open;
        const col  = bull ? 'var(--moss)' : 'var(--oxblood)';
        const cx   = x(i);
        const top  = Math.min(y(c.open), y(c.close));
        const bot  = Math.max(y(c.open), y(c.close));
        const bh   = Math.max(1, bot - top);
        return (
          <g key={i}>
            <line x1={cx} x2={cx} y1={y(c.high)} y2={y(c.low)} stroke={col} strokeWidth="0.8" />
            <rect x={cx - bw/2} y={top} width={bw} height={bh} fill={col} opacity="0.85" />
          </g>
        );
      })}
      <g className="chart-axis">
        <line x1={M.l} y1={height - M.b} x2={width - M.r} y2={height - M.b} />
        {[0, 0.5, 1].map(t => (
          <text key={t} x={M.l - 5} y={M.t + h * (1 - t) + 3} textAnchor="end">
            {(pMin + range * t).toFixed(0)}
          </text>
        ))}
      </g>
    </svg>
  );
}

function PageRiskModel() {
  const scored = React.useMemo(() => {
    return DATA.countries.map(c => {
      const ww = DATA.wastewater.find(w =>
        w.site.toLowerCase().includes(c.iso.toLowerCase()) || w.site.toLowerCase().includes(c.name.slice(0,4).toLowerCase())
      );
      const res = DATA.reservoirs.find(r =>
        r.region.toLowerCase().includes(c.name.slice(0,4).toLowerCase()) || r.region.includes(c.iso)
      );
      const srch = DATA.searches.find(s =>
        s.region.toLowerCase().includes(c.name.slice(0,4).toLowerCase()) || s.region.includes(c.iso)
      );
      const hosp = DATA.hospitals.find(h =>
        h.region.toLowerCase().includes(c.name.slice(0,4).toLowerCase())
      );

      const W_case   = Math.min(1, (c.total30 || 0) / 420);
      const W_trend  = c.trend7d > 0 ? Math.min(1, c.trend7d * 7) : 0;
      const W_res    = res ? ({ high: 0.92, elevated: 0.68, moderate: 0.42, declining: 0.18 }[res.risk] || 0.2) : 0.15;
      const W_ww     = ww  ? ({ high: 0.92, elevated: 0.72, moderate: 0.48, low: 0.22, detected: 0.18 }[ww.level] || 0.1) : 0.08;
      const W_search = srch ? Math.min(1, srch.z / 6) : 0.05;
      const W_hosp   = hosp ? hosp.icu : 0.6;

      const score = Math.round(
        W_case  * 0.28 +
        W_trend * 0.18 +
        W_res   * 0.24 +
        W_ww    * 0.16 +
        W_search* 0.08 +
        W_hosp  * 0.06
      ) * 100;

      const riskLevel =
        score > 62 ? 'critical' :
        score > 42 ? 'elevated' :
        score > 22 ? 'watch' : 'stable';

      return {
        ...c, score,
        riskLevel,
        drivers: {
          'Cases':     W_case,
          'Trend 7d':  W_trend,
          'Reservoir': W_res,
          'Wastewater':W_ww,
          'Search':    W_search,
          'ICU load':  W_hosp,
        }
      };
    }).sort((a, b) => b.score - a.score);
  }, []);

  const [sel, setSel] = React.useState(scored[0] || null);

  const financeBasket = DATA.finance.filter(f => f.cls === 'pharma' || f.sym === 'VIX' || f.cls === 'etf');

  return (
    <div className="page" data-screen-label="XVI Risk">
      <div className="page-head">
        <div>
          <div className="upper">XVI · Outbreak Risk Model</div>
          <h1>Six-factor composite risk scoring, every jurisdiction.</h1>
          <div className="deck">
            Weights: case burden 28%, reservoir pressure 24%, trend 18%, wastewater 16%, search signal 8%, ICU load 6%. Calibrated against 14 outbreaks 2003–2025. Scores are 0–100; not a forecast; confidence ± 12 points at 95th percentile.
          </div>
        </div>
        <div className="meta">
          {scored.length} jurisdictions<br/>
          model v1.4 · AUC 0.82<br/>
          last run 14:42Z
        </div>
      </div>

      <div className="row cols-4" style={{ marginBottom: 16 }}>
        <div className="kpi">
          <div className="name">Critical ≥62</div>
          <div className="val tnum" style={{ color: 'var(--sev-critical)' }}>
            {scored.filter(c => c.riskLevel === 'critical').length}
          </div>
        </div>
        <div className="kpi">
          <div className="name">Elevated 42–61</div>
          <div className="val tnum" style={{ color: 'var(--sev-elevated)' }}>
            {scored.filter(c => c.riskLevel === 'elevated').length}
          </div>
        </div>
        <div className="kpi">
          <div className="name">Watch 22–41</div>
          <div className="val tnum" style={{ color: 'var(--sev-watch)' }}>
            {scored.filter(c => c.riskLevel === 'watch').length}
          </div>
        </div>
        <div className="kpi">
          <div className="name">Mean score</div>
          <div className="val tnum">
            {Math.round(scored.reduce((s, c) => s + c.score, 0) / scored.length)}
          </div>
          <div className="sub">of 100, {scored.length} jurisdictions</div>
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
        {/* Rankings */}
        <div className="panel">
          <div className="panel-head">
            <span className="label">Risk ranking · all jurisdictions</span>
            <span className="sub">click row for driver detail</span>
          </div>
          <div className="panel-body" style={{ padding: 0, maxHeight: 460, overflow: 'auto' }}>
            <table className="data">
              <thead>
                <tr>
                  <th>#</th><th>Country</th><th className="num">Score</th>
                  <th>Level</th><th>Bar</th>
                </tr>
              </thead>
              <tbody>
                {scored.map((c, i) => (
                  <tr key={c.iso}
                    style={{ cursor: 'pointer', background: sel?.iso === c.iso ? 'var(--paper-2)' : '' }}
                    onClick={() => setSel(c)}>
                    <td className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>{i + 1}</td>
                    <td style={{ fontFamily: 'var(--serif)' }}>{c.name}</td>
                    <td className="num mono" style={{ fontWeight: 600 }}>{c.score}</td>
                    <td><span className={`pill ${c.riskLevel}`}>{c.riskLevel}</span></td>
                    <td>
                      <div style={{ width: 80, height: 7, background: 'var(--paper-3)', position: 'relative' }}>
                        <div style={{
                          position: 'absolute', inset: 0, right: 'auto',
                          width: c.score + '%',
                          background: c.riskLevel === 'critical' ? 'var(--sev-critical)' :
                                      c.riskLevel === 'elevated' ? 'var(--sev-elevated)' :
                                      c.riskLevel === 'watch'    ? 'var(--sev-watch)'    : 'var(--sev-stable)'
                        }} />
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        {/* Detail panel */}
        <div>
          {sel ? (
            <div className="panel">
              <div className="panel-head">
                <span className="label">{sel.name} · driver detail</span>
                <span className="sub">composite {sel.score} / 100 · {sel.riskLevel}</span>
              </div>
              <div className="panel-body">
                <div style={{ display: 'flex', gap: 24, alignItems: 'flex-start' }}>
                  <RadarChart drivers={sel.drivers} size={200} />
                  <div style={{ flex: 1 }}>
                    {Object.entries(sel.drivers).map(([k, v]) => (
                      <div key={k} style={{ marginBottom: 10 }}>
                        <div className="flex between" style={{ marginBottom: 3 }}>
                          <span style={{ fontFamily: 'var(--serif)', fontSize: 13 }}>{k}</span>
                          <span className="mono" style={{ fontSize: 10.5 }}>{Math.round(v * 100)}</span>
                        </div>
                        <div style={{ height: 7, background: 'var(--paper-3)', width: '100%' }}>
                          <div style={{
                            height: '100%', width: (Math.min(1, v) * 100) + '%',
                            background: v > 0.7 ? 'var(--oxblood)' : v > 0.4 ? 'var(--ochre-deep)' : 'var(--moss)'
                          }} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="footnote mt-m">
                  {sel.riskLevel === 'critical' && `${sel.name} sits at the high end of the distribution across most drivers. The combination of elevated reservoir pressure, rising case trend, and ICU strain suggests the current conditions are consistent with sustained transmission risk.`}
                  {sel.riskLevel === 'elevated' && `${sel.name} shows elevated scores in two or more drivers. Continue monitoring wastewater signals and trend data over the next 7-day window.`}
                  {sel.riskLevel === 'watch' && `${sel.name} has at least one driver in the elevated range. Standard surveillance cadence applies; no enhanced response triggered.`}
                  {sel.riskLevel === 'stable' && `${sel.name} is below all alert thresholds. Background monitoring only.`}
                </div>
              </div>
            </div>
          ) : (
            <div className="panel">
              <div className="panel-head"><span className="label">Select a country</span></div>
              <div className="panel-body" style={{ padding: 40, textAlign: 'center', color: 'var(--ink-4)', fontFamily: 'var(--serif)', fontStyle: 'italic' }}>
                Click any row in the ranking table to see the driver breakdown and spider chart.
              </div>
            </div>
          )}

          <div className="panel mt-l">
            <div className="panel-head">
              <span className="label">Pandemic-basket candlestick · 30 days</span>
              <span className="sub">OHLC · daily · pharma vs travel divergence</span>
            </div>
            <div className="panel-body">
              <div className="row cols-2">
                {financeBasket.slice(0, 4).map(f => (
                  <div key={f.sym}>
                    <div className="upper" style={{ marginBottom: 6 }}>
                      {f.sym} · {f.name.split(' ')[0]}
                      <span className="mono" style={{ marginLeft: 8, color: f.pct >= 0 ? 'var(--moss)' : 'var(--oxblood)' }}>
                        {f.pct >= 0 ? '+' : ''}{f.pct.toFixed(2)}%
                      </span>
                    </div>
                    <CandlestickChart series={f.series} width={300} height={100} />
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div className="footnote mt-l">
        Model calibration: precision 0.76, recall 0.83 at score threshold 42 (elevated). Validated on held-out data: 2024 H5N1 US dairy cluster, 2022 Mpox clade II, 2022 Marburg Angola, 2024 Oropouche Brazil. Reservoir pressure is the highest-AUC single predictor (AUC 0.82). The model does not incorporate human behavioral or healthcare-access covariates; scores are therefore most comparable within similar-capacity health systems.
      </div>
    </div>
  );
}

window.PageRiskModel = PageRiskModel;
window.CandlestickChart = CandlestickChart;

</script>

<!-- app.jsx -->
<script type="text/babel">
/* global React, ReactDOM, Shell, PageOverview, PageCases, PageFlights, PageFinance,
   PageHospitals, PageNews, PageAlerts, PageReservoirs, PageWastewater,
   PageGenomic, PageSearch, PageMethodology, PageSources, PageAPI,
   TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakToggle, TweakSelect, TweakColor
*/

const { HeaderBar, Rail, StatusTicker } = Shell;
const { useState: appUseState, useEffect: appUseEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "landingVariant": "map",
  "flightViz": "arcs",
  "globeStyle": "paper",
  "autorotate": true,
  "tickerOn": true,
  "denseMode": false
}/*EDITMODE-END*/;

function App() {
  const [page, setPage] = appUseState('overview');
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Density mode
  appUseEffect(() => {
    if (t.denseMode) {
      document.documentElement.style.setProperty('--header-h', '54px');
      document.body.style.fontSize = '12px';
    } else {
      document.documentElement.style.setProperty('--header-h', '68px');
      document.body.style.fontSize = '13px';
    }
  }, [t.denseMode]);

  const pages = {
    overview:    <PageOverview variant={t.landingVariant} />,
    cases:       <PageCases />,
    alerts:      <PageAlerts />,
    news:        <PageNews />,
    reservoirs:  <PageReservoirs />,
    wastewater:  <PageWastewater />,
    genomic:     <PageGenomic />,
    search:      <PageSearch />,
    flights:     <PageFlights viz={t.flightViz} />,
    hospitals:   <PageHospitals />,
    finance:     <PageFinance />,
    methodology: <PageMethodology />,
    sources:     <PageSources />,
    api:         <PageAPI />,
  };

  return (
    <div className="app">
      <Rail page={page} setPage={setPage} />
      <HeaderBar page={page} setPage={setPage} />
      <main className="main" key={page}>
        {pages[page] || pages.overview}
      </main>
      {t.tickerOn ? <StatusTicker /> : <div style={{ gridArea: 'status' }} />}

      <TweaksPanel title="Observatory · Tweaks">
        <TweakSection label="Front matter">
          <TweakRadio
            label="Landing layout"
            value={t.landingVariant}
            onChange={v => setTweak('landingVariant', v)}
            options={[
              { value: 'map',       label: 'Map-led' },
              { value: 'ticker',    label: 'Ticker-led' },
              { value: 'editorial', label: 'Editorial' },
            ]}
          />
          <TweakToggle
            label="Live ticker bar"
            value={t.tickerOn}
            onChange={v => setTweak('tickerOn', v)}
          />
          <TweakToggle
            label="Dense mode"
            value={t.denseMode}
            onChange={v => setTweak('denseMode', v)}
          />
        </TweakSection>
        <TweakSection label="Globe & flights">
          <TweakRadio
            label="Globe palette"
            value={t.globeStyle}
            onChange={v => setTweak('globeStyle', v)}
            options={[
              { value: 'paper', label: 'Paper' },
              { value: 'dark',  label: 'Ink' },
            ]}
          />
          <TweakToggle
            label="Globe auto-rotate"
            value={t.autorotate}
            onChange={v => setTweak('autorotate', v)}
          />
          <TweakRadio
            label="Flight viz"
            value={t.flightViz}
            onChange={v => setTweak('flightViz', v)}
            options={[
              { value: 'arcs',    label: 'Arcs' },
              { value: 'heatmap', label: 'Heatmap' },
              { value: 'sankey',  label: 'Sankey' },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

</body>

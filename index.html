<html lang="en">
<head>

<meta property="og:type" content="website">
<meta property="og:title" content="The Hantavirus Observatory">
<meta property="og:description" content="16-panel epidemiological SPA — live flight traffic, real market data, GDELT news, NCBI genomic sequences, CDC wastewater, BTS border crossings.">
<meta property="og:url" content="https://ihelfrich.github.io/hantavirus-observatory/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="The Hantavirus Observatory">
<meta name="theme-color" content="#F2EEE3">
<link rel="canonical" href="https://ihelfrich.github.io/hantavirus-observatory/">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE HANTAVIRUS OBSERVATORY
   Calm academic / research journal aesthetic.
   ============================================================ */

:root {
  /* Paper & ink */
  --paper:        #F2EEE3;
  --paper-2:      #ECE7DA;
  --paper-3:      #E4DECF;
  --ink:          #15140F;
  --ink-2:        #2A2820;
  --ink-3:        #4A4736;
  --ink-4:        #6E6A55;
  --ink-5:        #918C75;
  --rule:         #C7C0AB;
  --rule-soft:    #D8D3C2;

  /* Accents — restrained */
  --ochre:        #B08234;
  --ochre-deep:   #8A6320;
  --oxblood:      #6B2A24;
  --moss:         #4A6043;
  --indigo:       #2C3D5C;
  --teal:         #2B5B5E;

  /* Alert hierarchy */
  --sev-stable:   #4A6043;
  --sev-watch:    #B08234;
  --sev-elevated: #B85B2A;
  --sev-critical: #6B2A24;

  /* Type */
  --serif:  'Source Serif 4', 'Source Serif Pro', 'Iowan Old Style', Georgia, serif;
  --sans:   'Inter', 'Helvetica Neue', system-ui, sans-serif;
  --mono:   'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;

  /* Layout */
  --rail-w:    232px;
  --header-h:  68px;
  --right-w:   320px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  font-feature-settings: 'ss01', 'tnum', 'cv11';
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, h5 {
  font-family: var(--serif);
  font-weight: 500;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--ink);
}

.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.serif { font-family: var(--serif); }
.sc {
  font-variant-caps: all-small-caps;
  letter-spacing: 0.08em;
  font-weight: 500;
}
.upper {
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--ink-3);
}

a { color: var(--ink); text-decoration: none; }
a:hover { color: var(--ochre-deep); }

button {
  font: inherit;
  color: inherit;
  background: transparent;
  border: 1px solid var(--rule);
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 0;
}
button:hover { background: var(--paper-2); }
button.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
button.primary:hover { background: var(--ink-2); }

input, select, textarea {
  font: inherit;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: 6px 10px;
  border-radius: 0;
}
input:focus, select:focus, textarea:focus {
  outline: 1px solid var(--ochre);
  outline-offset: -2px;
  border-color: var(--ochre);
}

/* ─── App shell ─────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  grid-template-rows: var(--header-h) 1fr 28px;
  grid-template-areas:
    "rail header"
    "rail main"
    "rail status";
  min-height: 100vh;
}

.header {
  grid-area: header;
  border-bottom: 1px solid var(--rule);
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  padding: 0 24px;
  background: var(--paper);
  position: sticky; top: 0; z-index: 30;
}

.masthead {
  display: flex;
  align-items: baseline;
  gap: 14px;
}
.masthead .title {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: -0.01em;
  line-height: 1;
}
.masthead .title em {
  font-style: italic;
  color: var(--ink-3);
  font-weight: 400;
}
.masthead .vol {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-4);
  letter-spacing: 0.04em;
}

.header-right {
  display: flex;
  gap: 18px;
  align-items: center;
  font-size: 11.5px;
  color: var(--ink-3);
}
.header-right .pulse {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-3);
}
.pulse .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--moss);
  box-shadow: 0 0 0 0 rgba(74,96,67,0.5);
  animation: pulse-dot 2.2s infinite;
}
@keyframes pulse-dot {
  0%   { box-shadow: 0 0 0 0 rgba(74,96,67,0.6); }
  70%  { box-shadow: 0 0 0 8px rgba(74,96,67,0); }
  100% { box-shadow: 0 0 0 0 rgba(74,96,67,0); }
}

/* ─── Rail ──────────────────────────────────────────────── */
.rail {
  grid-area: rail;
  border-right: 1px solid var(--rule);
  background: var(--paper-2);
  padding: 24px 0 24px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  overflow-y: auto;
}
.rail .brandmark {
  padding: 0 20px 22px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 14px;
}
.rail .brandmark .obs {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-3);
}
.rail .brandmark .num {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
  letter-spacing: 0.06em;
  margin-top: 4px;
}

.rail .section-label {
  padding: 18px 20px 6px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.rail .nav-item {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 7px 20px;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
  border-left: 2px solid transparent;
  font-family: var(--serif);
}
.rail .nav-item:hover { background: var(--paper-3); }
.rail .nav-item.active {
  background: var(--paper);
  border-left-color: var(--ochre);
  color: var(--ink);
}
.rail .nav-item .idx {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--ink-4);
  text-align: right;
}
.rail .nav-item .badge {
  font-family: var(--mono);
  font-size: 9px;
  background: var(--ochre);
  color: var(--paper);
  padding: 1px 4px;
}

/* ─── Main ──────────────────────────────────────────────── */
.main {
  grid-area: main;
  overflow: hidden;
  background: var(--paper);
}

/* ─── Status bar ────────────────────────────────────────── */
.status {
  grid-area: status;
  border-top: 1px solid var(--rule);
  background: var(--paper-2);
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 0 20px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
  letter-spacing: 0.04em;
}
.status .ticker {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
}
.status .ticker .item { margin-right: 36px; }
.status .ticker .delta-up { color: var(--oxblood); }
.status .ticker .delta-down { color: var(--moss); }

/* ─── Cards / panels ────────────────────────────────────── */
.panel {
  border: 1px solid var(--rule);
  background: var(--paper);
}
.panel-head {
  padding: 12px 16px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}
.panel-head .label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  font-weight: 600;
}
.panel-head .sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
}
.panel-body { padding: 16px; }

/* Hairline KPIs */
.kpi {
  padding: 14px 16px;
  border: 1px solid var(--rule);
  background: var(--paper);
}
.kpi .name {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  font-weight: 600;
}
.kpi .val {
  font-family: var(--serif);
  font-size: 30px;
  line-height: 1.1;
  margin-top: 6px;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.kpi .sub {
  margin-top: 4px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
}
.kpi .delta-up { color: var(--oxblood); }
.kpi .delta-down { color: var(--moss); }

/* Tables */
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
table.data th {
  text-align: left;
  font-weight: 600;
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-4);
  padding: 8px 12px;
  border-bottom: 1px solid var(--rule);
  background: var(--paper-2);
  position: sticky;
  top: 0;
}
table.data td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--rule-soft);
  font-variant-numeric: tabular-nums;
  vertical-align: top;
}
table.data tr:hover td { background: var(--paper-2); }
table.data td.mono { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
table.data td.num  { text-align: right; }

/* Severity pills */
.pill {
  display: inline-block;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 1px 6px;
  border: 1px solid currentColor;
  line-height: 1.4;
}
.pill.stable   { color: var(--sev-stable); }
.pill.watch    { color: var(--sev-watch); }
.pill.elevated { color: var(--sev-elevated); }
.pill.critical { color: var(--paper); background: var(--sev-critical); border-color: var(--sev-critical); }

/* Confidence bars */
.conf {
  display: inline-grid;
  grid-template-columns: repeat(5, 6px);
  gap: 2px;
  vertical-align: middle;
}
.conf i { display: block; height: 9px; background: var(--rule); }
.conf i.on { background: var(--ink-3); }

/* Sparkline container */
.spark { display: block; }

/* Page chrome */
.page {
  padding: 22px 28px 60px;
  max-width: 1640px;
  height: calc(100vh - var(--header-h) - 28px);
  overflow-y: auto;
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 26px;
}
.page-head h1 {
  font-size: 32px;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: 10px;
}
.page-head .deck {
  font-family: var(--serif);
  font-style: italic;
  color: var(--ink-3);
  font-size: 15px;
  margin-top: 4px;
  max-width: 56ch;
}
.page-head .meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
  text-align: right;
  line-height: 1.7;
}

/* Grid helpers */
.row { display: grid; gap: 16px; }
.row.cols-2 { grid-template-columns: 1fr 1fr; }
.row.cols-3 { grid-template-columns: repeat(3, 1fr); }
.row.cols-4 { grid-template-columns: repeat(4, 1fr); }
.row.cols-5 { grid-template-columns: repeat(5, 1fr); }
.row.cols-6 { grid-template-columns: repeat(6, 1fr); }

.flex { display: flex; }
.flex.between { justify-content: space-between; }
.flex.center { align-items: center; }
.flex.gap-s { gap: 8px; }
.flex.gap-m { gap: 16px; }
.flex.gap-l { gap: 24px; }

.mt-s { margin-top: 8px; }
.mt-m { margin-top: 16px; }
.mt-l { margin-top: 24px; }

/* Globe / map */
.globe-wrap {
  position: relative;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  overflow: hidden;
}
.globe-wrap canvas, .globe-wrap svg {
  display: block;
  width: 100%; height: 100%;
}
.globe-overlay {
  position: absolute;
  pointer-events: none;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.06em;
}
.globe-overlay.tl { top: 12px; left: 14px; }
.globe-overlay.tr { top: 12px; right: 14px; text-align: right; }
.globe-overlay.bl { bottom: 12px; left: 14px; }
.globe-overlay.br { bottom: 12px; right: 14px; text-align: right; }
.globe-legend {
  display: grid;
  gap: 4px;
  pointer-events: auto;
}
.globe-legend .item { display: flex; gap: 8px; align-items: center; }
.globe-legend .swatch {
  width: 8px; height: 8px; border-radius: 50%; background: var(--ochre);
}

/* Charts */
.chart-axis line, .chart-axis path {
  stroke: var(--rule);
  stroke-width: 1;
  shape-rendering: crispEdges;
}
.chart-axis text {
  font-family: var(--mono);
  font-size: 9.5px;
  fill: var(--ink-4);
  letter-spacing: 0.04em;
}
.chart-grid line {
  stroke: var(--rule-soft);
  stroke-width: 1;
  shape-rendering: crispEdges;
}

/* News card */
.news-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--rule-soft);
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 14px;
  align-items: baseline;
}
.news-item:last-child { border-bottom: none; }
.news-item .time {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
}
.news-item .src {
  font-family: var(--mono);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ochre-deep);
}
.news-item .head {
  font-family: var(--serif);
  font-size: 14.5px;
  line-height: 1.35;
  color: var(--ink);
}
.news-item .body {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 4px;
  max-width: 70ch;
}

/* Footnotes / methodology */
.footnote {
  font-family: var(--serif);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-3);
  line-height: 1.55;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--rule);
}
.tab {
  padding: 8px 16px;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-4);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  font-weight: 500;
}
.tab.active {
  color: var(--ink);
  border-bottom-color: var(--ochre);
}
.tab:hover { color: var(--ink-2); }

/* Scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--paper-2); }
::-webkit-scrollbar-thumb {
  background: var(--rule);
  border: 2px solid var(--paper-2);
}
::-webkit-scrollbar-thumb:hover { background: var(--ink-5); }

/* Dropcap for editorial */
.dropcap::first-letter {
  font-family: var(--serif);
  font-size: 56px;
  float: left;
  line-height: 0.9;
  margin: 6px 8px 0 0;
  color: var(--oxblood);
}

/* Decorative ornament */
.ornament {
  text-align: center;
  font-family: var(--serif);
  color: var(--ink-4);
  letter-spacing: 0.4em;
  margin: 16px 0;
}

/* Live indicators */
.live-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--oxblood);
}
.live-tag::before {
  content: '';
  display: block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--oxblood);
  animation: blink 1.5s infinite;
}
@keyframes blink { 50% { opacity: 0.25; } }

/* Hierarchical lists */
ul.refs {
  list-style: none;
  padding: 0;
  margin: 0;
}
ul.refs li {
  padding: 6px 0;
  border-bottom: 1px dotted var(--rule);
  font-size: 12px;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 10px;
}
ul.refs li .n {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
}

/* Code/API blocks */
pre.code {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.55;
  padding: 16px;
  overflow-x: auto;
  margin: 0;
}
pre.code .c-key { color: #C9A84C; }
pre.code .c-str { color: #B5C9A0; }
pre.code .c-num { color: #D5A6A0; }
pre.code .c-com { color: #7C7560; font-style: italic; }

/* Subtle grain background option */
.grain::before {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Flight arc animation */
.flight-arc { stroke: var(--ochre); fill: none; opacity: 0.55; }
.flight-arc.hot { stroke: var(--oxblood); opacity: 0.85; }
.flight-plane { fill: var(--ink); }

/* Hospital capacity bars */
.cap-bar {
  display: grid;
  grid-template-columns: 1fr;
  height: 16px;
  background: var(--paper-3);
  position: relative;
}
.cap-bar .fill {
  height: 100%;
  background: var(--moss);
}
.cap-bar .fill.warn { background: var(--ochre); }
.cap-bar .fill.crit { background: var(--oxblood); }
.cap-bar .marker {
  position: absolute;
  top: -2px; bottom: -2px;
  width: 1px;
  background: var(--ink);
}

/* Sparklines inline */
.sparkline { vertical-align: middle; }

/* Researcher tags */
.tag {
  display: inline-block;
  font-family: var(--mono);
  font-size: 9.5px;
  padding: 1px 5px;
  border: 1px solid var(--rule);
  color: var(--ink-3);
  margin-right: 4px;
}

/* Wireframe label for placeholders */
.placeholder {
  border: 1px dashed var(--rule);
  background: var(--paper-2);
  padding: 22px;
  text-align: center;
  color: var(--ink-4);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* Editorial body */
.body-text {
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink-2);
  max-width: 64ch;
}
.body-text p + p { margin-top: 12px; }


/* standalone .src for PageAlerts/PageNews outside .news-item context */
.src { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ochre-deep); }
</style>
</head>
<body>
<script>
window.__obs_errors = [];
window.addEventListener('error', function(e) {
  window.__obs_errors.push(e);
  var root = document.getElementById('root');
  if (!root) return;
  root.innerHTML = '<div style="padding:32px 40px;font-family:monospace;background:#F2EEE3;min-height:100vh;color:#15140F">' +
    '<div style="font-size:11px;color:#6E6A55;margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase">The Hantavirus Observatory · Error</div>' +
    '<div style="color:#6B2A24;font-size:14px;font-weight:600;margin-bottom:12px">' + (e.message || 'Unknown JS error') + '</div>' +
    '<div style="font-size:10px;color:#6E6A55;margin-bottom:16px">' + (e.filename || '').replace(/.*\//,'') + ' line ' + (e.lineno||'?') + '</div>' +
    '<pre style="font-size:9.5px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:#4A4736">' +

<script>
/* ============================================================
   D3 Orthographic globe with case nodes, flight arcs, drag/rotate
   Renders to canvas for performance.
   ============================================================ */

window.Globe = (function () {

  // Cached world geometry
  let worldGeom = null;
  let worldLoadPromise = null;

  async function loadWorld() {
    if (worldGeom) return worldGeom;
    if (worldLoadPromise) return worldLoadPromise;
    worldLoadPromise = (async () => {
      // world-atlas 110m countries via unpkg
      const res = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json');
      const topo = await res.json();
      worldGeom = topojson.feature(topo, topo.objects.land);
      return worldGeom;
    })();
    return worldLoadPromise;
  }

  function createGlobe(container, opts) {
    opts = opts || {};
    const {
      cases = [],
      arcs = [],
      airports = [],
      style = 'dark', // 'dark' | 'paper'
      rotation = [-30, -20, 0],
      autorotate = true,
      showGraticule = true,
      arcAnimate = true,
      onSelectNode = null,
    } = opts;

    container.innerHTML = '';
    const canvas = document.createElement('canvas');
    container.appendChild(canvas);

    const dpr = window.devicePixelRatio || 1;
    function resize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      projection.translate([w / 2, h / 2]).scale(Math.min(w, h) * 0.48);
    }

    const ctx = canvas.getContext('2d');
    const projection = d3.geoOrthographic().rotate(rotation).clipAngle(90);
    const path = d3.geoPath(projection, ctx);
    const geoCircle = d3.geoCircle();

    // Drag to rotate
    const drag = d3.drag().on('drag', (event) => {
      const [x, y] = projection.rotate();
      const k = 75 / projection.scale();
      projection.rotate([x + event.dx * k, Math.max(-89, Math.min(89, y - event.dy * k))]);
      autorotateState.paused = true;
      render();
    }).on('end', () => {
      setTimeout(() => { autorotateState.paused = false; }, 1200);
    });
    d3.select(canvas).call(drag);

    // Hover
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      let hit = null;
      for (const c of state.cases) {
        const p = projection([c.lon, c.lat]);
        if (!p) continue;
        const dx = p[0] - x, dy = p[1] - y;
        const r = nodeRadius(c) + 4;
        if (dx * dx + dy * dy < r * r) { hit = c; break; }
      }
      state.hover = hit;
      canvas.style.cursor = hit ? 'pointer' : (autorotateState.paused ? 'grabbing' : 'grab');
      render();
    });
    canvas.addEventListener('click', () => {
      if (state.hover && onSelectNode) onSelectNode(state.hover);
    });

    const autorotateState = { paused: !autorotate, last: performance.now() };

    const state = {
      cases, arcs, airports, style, showGraticule, arcAnimate,
      hover: null, time: 0,
    };

    function nodeRadius(c) {
      // log-scale radius
      const total = c.total30 != null ? c.total30 : (c.cases || 1);
      return 3 + Math.sqrt(total) * 0.6;
    }

    function severityColor(c, alpha) {
      const sev = c.severity || (c.cases > 400 ? 'critical' : c.cases > 100 ? 'elevated' : c.cases > 20 ? 'watch' : 'stable');
      const map = {
        critical: `rgba(120, 36, 28, ${alpha})`,
        elevated: `rgba(184, 91, 42, ${alpha})`,
        watch:    `rgba(176, 130, 52, ${alpha})`,
        stable:   `rgba(74, 96, 67, ${alpha})`,
      };
      return map[sev] || map.watch;
    }

    function paperFill() {
      return state.style === 'dark' ? '#1a1a1f' : '#F2EEE3';
    }
    function landFill() {
      return state.style === 'dark' ? '#2a2925' : '#E4DECF';
    }
    function lineColor() {
      return state.style === 'dark' ? '#3a382f' : '#C7C0AB';
    }

    function render() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      // Sphere
      ctx.beginPath();
      path({ type: 'Sphere' });
      ctx.fillStyle = paperFill();
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = lineColor();
      ctx.stroke();

      // Graticule
      if (state.showGraticule) {
        ctx.beginPath();
        path(d3.geoGraticule().step([15, 15])());
        ctx.lineWidth = 0.4;
        ctx.strokeStyle = state.style === 'dark' ? '#33312a' : '#D8D3C2';
        ctx.stroke();
      }

      // Land
      if (worldGeom) {
        ctx.beginPath();
        path(worldGeom);
        ctx.fillStyle = landFill();
        ctx.fill();
        ctx.lineWidth = 0.6;
        ctx.strokeStyle = state.style === 'dark' ? '#3a382f' : '#B8AE92';
        ctx.stroke();
      }

      // Endemic shading — circles around case nodes
      for (const c of state.cases) {
        const center = [c.lon, c.lat];
        const radius = Math.min(12, 1.5 + (c.total30 || 0) / 60);
        ctx.beginPath();
        path(geoCircle.center(center).radius(radius)());
        ctx.fillStyle = severityColor(c, 0.12);
        ctx.fill();
      }

      // Flight arcs
      const t = state.time;
      for (let i = 0; i < state.arcs.length; i++) {
        const arc = state.arcs[i];
        drawArc(arc, t, i);
      }

      // Case nodes (only those visible)
      for (let ci = 0; ci < state.cases.length; ci++) {
        const c = state.cases[ci];
        const p = projection([c.lon, c.lat]);
        if (!p) continue;
        // Check if on near side
        const rot = projection.rotate();
        const cosc = Math.sin(c.lat * Math.PI / 180) * Math.sin(-rot[1] * Math.PI / 180) +
                     Math.cos(c.lat * Math.PI / 180) * Math.cos(-rot[1] * Math.PI / 180) *
                     Math.cos((c.lon + rot[0]) * Math.PI / 180);
        if (cosc < 0) continue;
        const r = nodeRadius(c);
        // outer pulse
        const pulseR = r + 3 + ((t * 0.002 + ci * 0.07) % 1) * 8;
        const pulseA = 1 - ((t * 0.002 + ci * 0.07) % 1);
        ctx.beginPath();
        ctx.arc(p[0], p[1], pulseR, 0, Math.PI * 2);
        ctx.fillStyle = severityColor(c, pulseA * 0.15);
        ctx.fill();

        // Filled
        ctx.beginPath();
        ctx.arc(p[0], p[1], r, 0, Math.PI * 2);
        ctx.fillStyle = severityColor(c, 0.85);
        ctx.fill();
        ctx.lineWidth = 0.8;
        ctx.strokeStyle = state.style === 'dark' ? '#0f0f12' : '#F2EEE3';
        ctx.stroke();

        // Label for largest
        if (state.hover === c || c.total30 > 200) {
          ctx.font = '500 10.5px "JetBrains Mono", monospace';
          ctx.fillStyle = state.style === 'dark' ? '#d8d3c2' : '#2A2820';
          ctx.textBaseline = 'middle';
          const label = `${c.iso || c.id || ''}  ${c.total30 ?? c.cases ?? ''}`;
          ctx.fillText(label, p[0] + r + 5, p[1]);
        }
      }

      // Hover detail
      if (state.hover) {
        const c = state.hover;
        const p = projection([c.lon, c.lat]);
        if (p) drawTooltip(p[0] + 12, p[1] + 12, c);
      }
    }

    function drawArc(arc, t, idx) {
      const interpolate = d3.geoInterpolate(arc.from, arc.to);
      const dist = d3.geoDistance(arc.from, arc.to);
      const steps = Math.max(24, Math.round(dist * 80));
      const phase = state.arcAnimate ? ((t * 0.0004 + idx * 0.13) % 1) : 1;
      const trailLen = 0.18;

      ctx.beginPath();
      let started = false;
      for (let i = 0; i <= steps; i++) {
        const f = i / steps;
        const pt = projection(interpolate(f));
        if (!pt) { started = false; continue; }
        if (!started) { ctx.moveTo(pt[0], pt[1]); started = true; }
        else ctx.lineTo(pt[0], pt[1]);
      }
      ctx.lineWidth = 0.6;
      ctx.strokeStyle = arc.hot
        ? (state.style === 'dark' ? 'rgba(190, 90, 70, 0.4)' : 'rgba(107, 42, 36, 0.35)')
        : (state.style === 'dark' ? 'rgba(176, 130, 52, 0.28)' : 'rgba(176, 130, 52, 0.32)');
      ctx.stroke();

      // Animated head
      if (state.arcAnimate) {
        ctx.beginPath();
        let started2 = false;
        const start = Math.max(0, phase - trailLen);
        const i0 = Math.floor(start * steps);
        const i1 = Math.ceil(phase * steps);
        for (let i = i0; i <= i1; i++) {
          const pt = projection(interpolate(i / steps));
          if (!pt) { started2 = false; continue; }
          if (!started2) { ctx.moveTo(pt[0], pt[1]); started2 = true; }
          else ctx.lineTo(pt[0], pt[1]);
        }
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = arc.hot
          ? 'rgba(190, 90, 70, 0.95)'
          : (state.style === 'dark' ? 'rgba(220, 180, 100, 0.9)' : 'rgba(138, 99, 32, 0.95)');
        ctx.stroke();

        // Head dot
        const head = projection(interpolate(phase));
        if (head) {
          ctx.beginPath();
          ctx.arc(head[0], head[1], 1.6, 0, Math.PI * 2);
          ctx.fillStyle = arc.hot ? '#8a2a22' : (state.style === 'dark' ? '#dcb464' : '#8A6320');
          ctx.fill();
        }
      }
    }

    function drawTooltip(x, y, c) {
      const lines = [
        c.name || c.loc || c.iso,
        `${c.total30 ?? c.cases ?? '—'} cases (30d)`,
        c.virus ? `${c.virus}` : null,
        c.severity ? c.severity.toUpperCase() : null,
      ].filter(Boolean);
      const w = 200, h = lines.length * 16 + 12;
      ctx.fillStyle = state.style === 'dark' ? '#0c0d10' : '#15140F';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#F2EEE3';
      ctx.font = '11px "JetBrains Mono", monospace';
      lines.forEach((line, i) => {
        ctx.fillText(line, x + 10, y + 18 + i * 16);
      });
    }

    // Animation loop
    function tick(now) {
      const dt = now - autorotateState.last;
      autorotateState.last = now;
      state.time = now;
      if (!autorotateState.paused) {
        const r = projection.rotate();
        projection.rotate([r[0] + dt * 0.01, r[1], r[2]]);
      }
      render();
      requestAnimationFrame(tick);
    }

    // Initial load
    loadWorld().then(() => render());
    requestAnimationFrame(tick);

    // Public API
    return {
      update(newOpts) {
        Object.assign(state, newOpts);
        render();
      },
      rotate(rot) {
        projection.rotate(rot);
        render();
      },
      pauseAutorotate(p) { autorotateState.paused = p; },
      resize,
      destroy() {
        canvas.remove();
      },
      el: canvas,
    };
  }

  return { createGlobe, loadWorld };
})();

</script>

<script>
/* ============================================================
   Globe3D — Three.js WebGL globe
   · Canvas-texture Earth (D3 equirectangular land fill)
   · Pulsing severity nodes
   · 600-particle flight system (AdditiveBlending glow)
   · Starfield background
   · Mouse drag + pinch-zoom
   ============================================================ */
window.Globe3D = (function () {
  'use strict';
  var DEG = Math.PI / 180;

  function ll2v(lat, lon, r) {
    var phi = (90 - lat) * DEG;
    var th  = (lon + 180) * DEG;
    return new THREE.Vector3(
      -r * Math.sin(phi) * Math.cos(th),
       r * Math.cos(phi),
       r * Math.sin(phi) * Math.sin(th)
    );
  }

  // Build Earth texture via D3 equirectangular on canvas
  function makeEarthTex() {
    var W = 2048, H = 1024;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d');

    // Ocean base
    ctx.fillStyle = '#06101e';
    ctx.fillRect(0, 0, W, H);

    // Subtle grid lines
    ctx.strokeStyle = '#0c1828'; ctx.lineWidth = 0.5;
    for (var lo = -180; lo <= 180; lo += 20) {
      var x = ((lo + 180) / 360) * W;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (var la = -90; la <= 90; la += 20) {
      var y = ((90 - la) / 180) * H;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    var tex = new THREE.CanvasTexture(cv);

    // Async: load topojson and paint land + borders
    Promise.all([
      fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(function(r){return r.json();}),
      fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(function(r){return r.json();})
    ]).then(function(results) {
      var landTopo    = results[0];
      var countryTopo = results[1];
      var proj = d3.geoEquirectangular().scale(W / (2 * Math.PI)).translate([W / 2, H / 2]);
      var path = d3.geoPath(proj, ctx);

      // Land fill — warm dark green
      var land = topojson.feature(landTopo, landTopo.objects.land);
      ctx.fillStyle = '#1b2211';
      ctx.beginPath(); path(land); ctx.fill();

      // Coastal glow
      ctx.strokeStyle = '#2e4018'; ctx.lineWidth = 1.2;
      ctx.beginPath(); path(land); ctx.stroke();

      // Country borders
      var borders = topojson.mesh(countryTopo, countryTopo.objects.countries, function(a,b){return a !== b;});
      ctx.strokeStyle = '#3a5020'; ctx.lineWidth = 0.55;
      ctx.beginPath(); path(borders); ctx.stroke();

      tex.needsUpdate = true;
    }).catch(function() { tex.needsUpdate = true; });

    return tex;
  }

  // Flight particle system — 600 particles across all routes
  function makeParticles(routes, airports) {
    var N = Math.min(600, routes.length * 10);
    var pos  = new Float32Array(N * 3);
    var col  = new Float32Array(N * 3);
    var pdata = [];

    for (var i = 0; i < N; i++) {
      var ri = i % routes.length;
      var r  = routes[ri];
      var a0 = null, a1 = null;
      for (var j = 0; j < airports.length; j++) {
        if (airports[j].iata === r[0]) a0 = airports[j];
        if (airports[j].iata === r[1]) a1 = airports[j];
      }
      pdata.push((a0 && a1) ? {
        lat0: a0.lat, lon0: a0.lon, lat1: a1.lat, lon1: a1.lon,
        phase: Math.random(), speed: 0.12 + Math.random() * 0.16,
        hot: r[2] === 'high'
      } : null);
      // Park off-screen initially
      pos[i*3] = pos[i*3+1] = pos[i*3+2] = 999;
    }

    var geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geom.setAttribute('color',    new THREE.BufferAttribute(col, 3));
    var mat = new THREE.PointsMaterial({
      size: 0.011, vertexColors: true,
      transparent: true, opacity: 0.92,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true
    });
    var pts = new THREE.Points(geom, mat);
    pts.renderOrder = 2;

    function tick(dt) {
      for (var i = 0; i < N; i++) {
        var pd = pdata[i];
        if (!pd) continue;
        pd.phase = (pd.phase + pd.speed * dt) % 1;
        var t   = pd.phase;
        var lat = pd.lat0 + (pd.lat1 - pd.lat0) * t;
        var lon = pd.lon0 + (pd.lon1 - pd.lon0) * t;
        var alt = 1.012 + 0.17 * Math.sin(Math.PI * t);
        var v   = ll2v(lat, lon, alt);
        pos[i*3]   = v.x; pos[i*3+1] = v.y; pos[i*3+2] = v.z;
        var f = Math.sin(Math.PI * t) * 0.88 + 0.12;
        if (pd.hot) {
          col[i*3] = f*0.96; col[i*3+1] = f*0.20; col[i*3+2] = f*0.14;
        } else {
          col[i*3] = f*0.84; col[i*3+1] = f*0.65; col[i*3+2] = f*0.26;
        }
      }
      geom.attributes.position.needsUpdate = true;
      geom.attributes.color.needsUpdate    = true;
    }
    return { pts: pts, tick: tick };
  }

  // ── Main create function ──────────────────────────────
  function create(container, opts) {
    if (!window.THREE) { console.warn('Three.js not loaded'); return null; }
    opts = opts || {};
    var cases      = opts.cases      || [];
    var routes     = opts.routes     || [];
    var airports   = opts.airports   || [];
    var autoRotate = opts.autoRotate !== false;
    var style      = opts.style      || 'dark';
    var onSelect   = opts.onSelect   || null;

    // Scene
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(style === 'dark' ? 0x090810 : 0xf2eee3);

    var W = container.clientWidth  || 900;
    var H = container.clientHeight || 600;
    var camera = new THREE.PerspectiveCamera(42, W / H, 0.01, 200);
    camera.position.z = 2.85;

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    container.innerHTML = '';
    container.appendChild(renderer.domElement);

    // Stars
    if (style === 'dark') {
      var sp = new Float32Array(5000 * 3);
      for (var i = 0; i < 5000; i++) {
        var sth = Math.random() * Math.PI * 2;
        var sph = Math.acos(2 * Math.random() - 1);
        var sr  = 50 + Math.random() * 40;
        sp[i*3]   = sr * Math.sin(sph) * Math.cos(sth);
        sp[i*3+1] = sr * Math.cos(sph);
        sp[i*3+2] = sr * Math.sin(sph) * Math.sin(sth);
      }
      var sg = new THREE.BufferGeometry();
      sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
      scene.add(new THREE.Points(sg, new THREE.PointsMaterial({
        color: 0xfff8e8, size: 0.10, transparent: true, opacity: 0.50, sizeAttenuation: true
      })));
    }

    // Lights
    scene.add(new THREE.AmbientLight(style === 'dark' ? 0x1e1810 : 0xf0e8d0, style === 'dark' ? 2.8 : 4));
    var sun = new THREE.DirectionalLight(0xfff0d0, style === 'dark' ? 2.4 : 1.2);
    sun.position.set(4, 2, 4); scene.add(sun);
    var fill = new THREE.DirectionalLight(0x1a3060, 0.5);
    fill.position.set(-3, -1, -3); scene.add(fill);

    // Earth sphere
    var earthTex = makeEarthTex();
    var earthMat;
    if (style === 'dark') {
      earthMat = new THREE.MeshPhongMaterial({
        map: earthTex, specular: 0x0a1830, shininess: 14,
        emissive: 0x030608, emissiveIntensity: 0.5
      });
    } else {
      earthMat = new THREE.MeshPhongMaterial({ map: earthTex, specular: 0x888880, shininess: 3 });
    }
    var earth = new THREE.Mesh(new THREE.SphereGeometry(1, 72, 72), earthMat);
    scene.add(earth);

    // Atmosphere (dark only)
    if (style === 'dark') {
      scene.add(new THREE.Mesh(
        new THREE.SphereGeometry(1.065, 32, 32),
        new THREE.MeshPhongMaterial({
          color: 0x0a1835, emissive: 0x060c22, emissiveIntensity: 0.9,
          transparent: true, opacity: 0.20, side: THREE.BackSide, depthWrite: false
        })
      ));
      scene.add(new THREE.Mesh(
        new THREE.SphereGeometry(1.022, 32, 32),
        new THREE.MeshPhongMaterial({
          color: 0x1a3868, transparent: true, opacity: 0.055, depthWrite: false
        })
      ));
    }

    // Case nodes
    var caseGroup  = new THREE.Group();
    scene.add(caseGroup);
    var pickTargets = [];
    var SVCOL = { critical: 0x8B2B20, elevated: 0xC86030, watch: 0xB08234, stable: 0x4A6043 };

    cases.forEach(function(c) {
      var sz  = Math.max(0.007, Math.min(0.046, Math.sqrt(c.total30 || 1) * 0.004));
      var col = SVCOL[c.severity] || SVCOL.watch;
      var pos = ll2v(c.lat, c.lon, 1.017);

      var core = new THREE.Mesh(
        new THREE.SphereGeometry(sz, 10, 10),
        new THREE.MeshBasicMaterial({ color: col })
      );
      core.position.copy(pos);
      core.userData = c;
      caseGroup.add(core);
      pickTargets.push(core);

      var halo = new THREE.Mesh(
        new THREE.SphereGeometry(sz * 3.8, 8, 8),
        new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.07, depthWrite: false })
      );
      halo.position.copy(pos);
      caseGroup.add(halo);

      var ring = new THREE.Mesh(
        new THREE.RingGeometry(sz * 1.8, sz * 2.5, 40),
        new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false })
      );
      ring.position.copy(pos);
      ring.lookAt(0, 0, 0);
      ring.userData.pulse = true;
      ring.userData.sz    = sz;
      ring.userData.seed  = Math.random();
      caseGroup.add(ring);
    });

    // Airport dots
    airports.forEach(function(a) {
      var pos  = ll2v(a.lat, a.lon, 1.013);
      var r    = Math.min(0.0095, 0.003 + a.vol * 0.00014);
      var dot  = new THREE.Mesh(
        new THREE.SphereGeometry(r, 6, 6),
        new THREE.MeshBasicMaterial({ color: style === 'dark' ? 0x6e6a55 : 0x4a4736, transparent: true, opacity: 0.55 })
      );
      dot.position.copy(pos);
      caseGroup.add(dot);
    });

    // Flight arc lines (static, dim)
    var arcGroup = new THREE.Group();
    scene.add(arcGroup);
    routes.forEach(function(r) {
      var a0 = null, a1 = null;
      airports.forEach(function(a) { if (a.iata === r[0]) a0 = a; if (a.iata === r[1]) a1 = a; });
      if (!a0 || !a1) return;
      var hot = r[2] === 'high';
      var pts = [];
      for (var k = 0; k <= 80; k++) {
        var t = k / 80;
        pts.push(ll2v(
          a0.lat + (a1.lat - a0.lat) * t,
          a0.lon + (a1.lon - a0.lon) * t,
          1 + 0.15 * Math.sin(Math.PI * t)
        ));
      }
      var geom2 = new THREE.BufferGeometry().setFromPoints(pts);
      arcGroup.add(new THREE.Line(geom2, new THREE.LineBasicMaterial({
        color: hot ? 0x7a2018 : 0x5a4810,
        transparent: true, opacity: hot ? 0.42 : 0.26, depthWrite: false
      })));
    });

    // Particle flights
    var flightSys = makeParticles(routes, airports);
    scene.add(flightSys.pts);

    // Mouse controls
    var theta = -0.5, phi = Math.PI * 0.44, rDist = 2.85;
    var dragging = false, lx = 0, ly = 0;
    var autoOn = autoRotate, autoPaused = false;
    var dom = renderer.domElement;
    dom.style.cursor = 'grab';

    dom.addEventListener('mousedown', function(e) {
      dragging = true; lx = e.clientX; ly = e.clientY;
      dom.style.cursor = 'grabbing'; autoPaused = true;
    });
    window.addEventListener('mouseup', function() {
      if (!dragging) return; dragging = false;
      dom.style.cursor = 'grab';
      setTimeout(function() { autoPaused = false; }, 1500);
    });
    dom.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      theta -= (e.clientX - lx) * 0.007;
      phi    = Math.max(0.12, Math.min(Math.PI - 0.12, phi - (e.clientY - ly) * 0.007));
      lx = e.clientX; ly = e.clientY;
    });
    dom.addEventListener('wheel', function(e) {
      rDist = Math.max(1.4, Math.min(5.5, rDist + e.deltaY * 0.004));
      e.preventDefault();
    }, { passive: false });

    // Touch
    var pinchD = 0;
    dom.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) { dragging = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; autoPaused = true; }
      if (e.touches.length === 2) pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }, { passive: true });
    dom.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1 && dragging) {
        theta -= (e.touches[0].clientX - lx) * 0.009;
        phi    = Math.max(0.12, Math.min(Math.PI - 0.12, phi - (e.touches[0].clientY - ly) * 0.009));
        lx = e.touches[0].clientX; ly = e.touches[0].clientY;
      }
      if (e.touches.length === 2) {
        var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        rDist = Math.max(1.4, Math.min(5.5, rDist * (pinchD / d)));
        pinchD = d;
      }
    }, { passive: true });
    dom.addEventListener('touchend', function() {
      dragging = false; setTimeout(function() { autoPaused = false; }, 1400);
    }, { passive: true });

    // Click to select node
    var raycaster = new THREE.Raycaster();
    var m2 = new THREE.Vector2();
    dom.addEventListener('click', function(e) {
      var rect = dom.getBoundingClientRect();
      m2.x = ((e.clientX - rect.left) / rect.width)  * 2 - 1;
      m2.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
      raycaster.setFromCamera(m2, camera);
      var hits = raycaster.intersectObjects(pickTargets);
      if (hits.length && onSelect) onSelect(hits[0].object.userData);
    });

    // Animation
    var animId, lastNow = 0;
    function animate(now) {
      animId = requestAnimationFrame(animate);
      var dt = Math.min((now - lastNow) / 1000, 0.08);
      lastNow = now;

      if (autoOn && !autoPaused) theta += 0.00038 * 60 * dt;
      camera.position.set(
        rDist * Math.sin(phi) * Math.sin(theta),
        rDist * Math.cos(phi),
        rDist * Math.sin(phi) * Math.cos(theta)
      );
      camera.lookAt(0, 0, 0);

      // Pulse rings
      caseGroup.children.forEach(function(obj) {
        if (!obj.userData.pulse) return;
        var phase = ((now / 2200) + obj.userData.seed * 9) % 1;
        obj.scale.setScalar(1 + phase * 3.8);
        obj.material.opacity = (1 - phase) * 0.48;
        obj.lookAt(0, 0, 0);
      });

      flightSys.tick(dt);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // Resize
    function resize() {
      var nW = container.clientWidth, nH = container.clientHeight;
      if (!nW || !nH) return;
      camera.aspect = nW / nH;
      camera.updateProjectionMatrix();
      renderer.setSize(nW, nH);
    }
    var ro = new ResizeObserver(resize);
    ro.observe(container);

    return {
      resize: resize,
      setAutoRotate: function(v) { autoOn = v; },
      destroy: function() {
        cancelAnimationFrame(animId);
        ro.disconnect();
        renderer.dispose();
        if (container.contains(dom)) container.removeChild(dom);
      }
    };
  }

  return { create: create, ll2v: ll2v };
})();

</script>

<!-- Live data API integrations -->
<script>
/* ============================================================
   LiveData — real API integrations (all free, CORS-friendly)
   · GDELT 2.0     — hantavirus news, no key
   · NCBI Eutils   — hantavirus genomic sequences, no key
   · OpenSky       — live aircraft states, anon (CORS best-effort)
   · WHO RSS       — via rss2json proxy
   · ProMED        — via rss2json proxy
   · ECDC          — via rss2json proxy
   · Yahoo Finance — unofficial v8 chart API (CORS-enabled)
   · CDC NWSS      — wastewater pathogen signal (Socrata, CORS)
   · BTS Border    — US land border crossings (Socrata, CORS)
   ============================================================ */
window.LiveData = (function () {
  'use strict';

  // ── GDELT 2.0 Doc API ─────────────────────────────────
  async function gdeltNews(query, n) {
    n = n || 25;
    var q = encodeURIComponent('"' + query + '" (outbreak OR cases OR virus OR epidemic OR hemorrhagic OR rodent OR surveillance)');
    var url = 'https://api.gdeltproject.org/api/v2/doc/doc?query=' + q +
      '&mode=artlist&maxrecords=' + n + '&format=json&timespan=14days&sort=DateDesc';
    try {
      var r = await fetch(url, { cache: 'no-cache' });
      var d = await r.json();
      return (d.articles || []).map(function(a) {
        var dt = a.seendatetime || '';
        var time = dt.length >= 12 ? dt.slice(8,10) + ':' + dt.slice(10,12) : '—';
        var src = (a.domain || '').replace(/^www\./, '').split('.')[0];
        src = src.charAt(0).toUpperCase() + src.slice(1);
        return {
          time: time, src: src || 'GDELT',
          head: a.title || '(untitled)', url: a.url,
          loc: a.sourcecountry || '', lang: a.language || 'en',
          tags: [a.language || 'en', a.sourcecountry || ''].filter(Boolean), live: true
        };
      }).filter(function(a) { return a.head && a.head !== '(untitled)'; });
    } catch(e) { console.warn('GDELT fetch failed:', e.message); return null; }
  }

  // ── NCBI E-utilities ──────────────────────────────────
  async function ncbiSequences(n) {
    n = n || 25;
    var BASE = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils';
    try {
      var sr = await fetch(BASE + '/esearch.fcgi?db=nuccore&term=hantavirus%5Borganism%5D+AND+2024:2026%5BPDAT%5D&retmax=' + n + '&sort=pub+date&retmode=json');
      var sd = await sr.json();
      var ids = (sd.esearchresult || {}).idlist || [];
      if (!ids.length) return null;
      var sumr = await fetch(BASE + '/esummary.fcgi?db=nuccore&id=' + ids.join(',') + '&retmode=json');
      var sumd = await sumr.json();
      return ((sumd.result || {}).uids || []).map(function(uid) {
        var s = sumd.result[uid] || {};
        return { acc: s.caption || uid, title: s.title || '', organism: s.organism || '',
                 length: s.slen || 0, updated: s.updatedate || '', live: true };
      });
    } catch(e) { console.warn('NCBI fetch failed:', e.message); return null; }
  }

  // ── OpenSky Network ───────────────────────────────────
  async function openSkyFlights() {
    try {
      var r = await fetch('https://opensky-network.org/api/states/all', {
        headers: { 'Accept': 'application/json' },
        cache: 'no-cache',
        signal: AbortSignal.timeout(10000)
      });
      if (!r.ok) return null;
      var d = await r.json();
      return (d.states || []).map(function(s) {
        return { icao24: s[0], callsign: (s[1] || '').trim(), country: s[2],
                 lon: s[5], lat: s[6], alt: s[7], onGround: s[8],
                 velocity: s[9], heading: s[10], live: true };
      }).filter(function(f) { return f.lat != null && f.lon != null && !f.onGround; });
    } catch(e) { console.warn('OpenSky fetch failed (expected for anon):', e.message); return null; }
  }

  // ── Yahoo Finance v8 chart API ────────────────────────
  // Fetches 30-day daily OHLC + current quote for each symbol.
  // Returns { SYM: { price, pct, series: [close...], live: true }, ... }
  async function yahooFinance(symbols) {
    symbols = symbols || ['MRNA','PFE','BNTX','GILD','REGN','CLX','AAL','DAL','UAL','CCL','RCL','HLT','IBB','JETS','XLV','^GSPC','^VIX'];
    var results = {};
    await Promise.allSettled(symbols.map(function(sym) {
      var url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(sym) +
                '?range=30d&interval=1d&includePrePost=false';
      return fetch(url, { cache: 'no-cache' })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var res = d.chart && d.chart.result && d.chart.result[0];
          if (!res) return;
          var meta = res.meta || {};
          var q = (res.indicators && res.indicators.quote && res.indicators.quote[0]) || {};
          var closes = (q.close || []).filter(function(v) { return v != null; });
          if (!meta.regularMarketPrice) return;
          results[sym] = {
            price: meta.regularMarketPrice,
            pct: meta.regularMarketChangePercent || 0,
            prev: meta.chartPreviousClose,
            currency: meta.currency,
            series: closes,
            live: true
          };
        })
        .catch(function() {});
    }));
    return Object.keys(results).length > 0 ? results : null;
  }

  // ── CDC NWSS Wastewater Surveillance ─────────────────
  // Returns recent pathogen signal data from CDC open data (Socrata, CORS OK).
  async function cdcWastewater() {
    try {
      var url = 'https://data.cdc.gov/resource/2ew6-ywp6.json' +
                '?$limit=100&$order=date_end+DESC&$where=percentile_75+IS+NOT+NULL';
      var r = await fetch(url, { headers: { 'Accept': 'application/json' }, cache: 'no-cache' });
      if (!r.ok) return null;
      return await r.json();
    } catch(e) { console.warn('CDC NWSS fetch failed:', e.message); return null; }
  }

  // ── BTS US Border Crossing Data ───────────────────────
  // Monthly land port-of-entry crossing counts (vehicles, pedestrians, trucks).
  // Data: Bureau of Transportation Statistics via data.transportation.gov (Socrata, CORS OK).
  async function btsBorderCrossings() {
    try {
      var url = 'https://data.transportation.gov/resource/keg4-3bc2.json' +
                '?$limit=200&$order=date+DESC&$where=value+%3E+0' +
                '&$select=port_name,state,border,date,measure,value';
      var r = await fetch(url, { headers: { 'Accept': 'application/json' }, cache: 'no-cache' });
      if (!r.ok) return null;
      return await r.json();
    } catch(e) { console.warn('BTS border fetch failed:', e.message); return null; }
  }

  // ── WHO RSS via rss2json.com ──────────────────────────
  async function whoRSS() {
    try {
      var feed = encodeURIComponent('https://www.who.int/rss-feeds/news-releases-en.xml');
      var r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + feed + '&count=20');
      var d = await r.json();
      return (d.items || []).map(function(item) {
        return { time: new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                 src: 'WHO', head: item.title, url: item.link, loc: 'Geneva', tags: ['WHO'], live: true };
      });
    } catch(e) { console.warn('WHO RSS failed:', e.message); return null; }
  }

  // ── ProMED RSS via rss2json.com ───────────────────────
  async function promedRSS() {
    try {
      var feed = encodeURIComponent('https://promedmail.org/feed/');
      var r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + feed + '&count=15');
      var d = await r.json();
      return (d.items || []).map(function(item) {
        return { time: new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                 src: 'ProMED', head: item.title, url: item.link, loc: 'Global',
                 tags: ['ProMED', 'surveillance'], live: true };
      });
    } catch(e) { console.warn('ProMED RSS failed:', e.message); return null; }

  // ── ECDC RSS ──────────────────────────────────────────
  async function ecdcRSS() {
    try {
      var feed = encodeURIComponent('https://www.ecdc.europa.eu/en/rss');
      var r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + feed + '&count=15');
      var d = await r.json();
      return (d.items || []).map(function(item) {
        return { time: new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                 src: 'ECDC', head: item.title, url: item.link, loc: 'Stockholm',
                 tags: ['ECDC'], live: true };
      });
    } catch(e) { console.warn('ECDC RSS failed:', e.message); return null; }
  }

  // ── Batch news fetcher ────────────────────────────────
  async function fetchAllNews() {
    var results = await Promise.allSettled([
      gdeltNews('hantavirus', 20), whoRSS(), promedRSS(), ecdcRSS()
    ]);
    var combined = [];
    results.forEach(function(r) {
      if (r.status === 'fulfilled' && Array.isArray(r.value)) combined = combined.concat(r.value);
    });
    var seen = new Set();
    combined = combined.filter(function(item) {
      var key = (item.head || '').slice(0, 60);
      if (seen.has(key)) return false;
      seen.add(key); return true;
    });
    return combined.length > 0 ? combined : null;
  }

  return { gdeltNews, ncbiSequences, openSkyFlights, yahooFinance,
           cdcWastewater, btsBorderCrossings,
           whoRSS, promedRSS, ecdcRSS, fetchAllNews };
})();

</script>

<!-- Live data manager: pre-fetches, caches, dispatches events -->
<script>
/* ============================================================
   LiveDataManager — orchestrates all real-data fetches,
   stores results in window.LIVE, and dispatches events so
   React components can update without a full re-render.
   ============================================================ */
window.LIVE = {
  finance: null, flights: null, news: null,
  wastewater: null, borders: null,
  status: {}, ts: {}
};

(function () {
  'use strict';

  function emit(key, data) {
    window.LIVE[key] = data;
    window.LIVE.status[key] = (data != null) ? 'live' : 'unavailable';
    window.LIVE.ts[key] = Date.now();
    window.dispatchEvent(new CustomEvent('livedata:update', { detail: { key, data } }));
    console.info('[LiveData]', key, data != null ? 'OK (' + (Array.isArray(data) ? data.length : Object.keys(data).length) + ')' : 'null');
  }

  async function fetchFinance() {
    if (typeof LiveData === 'undefined' || !LiveData.yahooFinance) return;
    try {
      var d = await LiveData.yahooFinance();
      emit('finance', d);
    } catch(e) { console.warn('[LiveData] finance error:', e); }
  }

  async function fetchFlights() {
    if (typeof LiveData === 'undefined') return;
    try {
      var d = await LiveData.openSkyFlights();
      emit('flights', d);
    } catch(e) { emit('flights', null); }
  }

  async function fetchNews() {
    if (typeof LiveData === 'undefined') return;
    try {
      var d = await LiveData.fetchAllNews();
      emit('news', d);
    } catch(e) { emit('news', null); }
  }

  async function fetchWastewater() {
    if (typeof LiveData === 'undefined' || !LiveData.cdcWastewater) return;
    try {
      var d = await LiveData.cdcWastewater();
      emit('wastewater', d);
    } catch(e) { emit('wastewater', null); }
  }

  async function fetchBorders() {
    if (typeof LiveData === 'undefined' || !LiveData.btsBorderCrossings) return;
    try {
      var d = await LiveData.btsBorderCrossings();
      emit('borders', d);
    } catch(e) { emit('borders', null); }
  }

  function init() {
    // Stagger so we don't hammer on load and don't block initial React render
    setTimeout(fetchNews,       800);
    setTimeout(fetchFinance,   1600);
    setTimeout(fetchFlights,   2400);
    setTimeout(fetchWastewater,3200);
    setTimeout(fetchBorders,   4000);

    // Refresh schedule
    setInterval(fetchFlights,   60_000);   // 1 min — aircraft positions
    setInterval(fetchFinance,  300_000);   // 5 min — market quotes
    setInterval(fetchNews,     300_000);   // 5 min — outbreak news
    setInterval(fetchWastewater,1_800_000);// 30 min — wastewater (slow-changing)
    setInterval(fetchBorders,  3_600_000); // 1 hr  — BTS border (monthly data)
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel">

const { useState: oUseState, useEffect: oUseEffect, useRef: oUseRef, useMemo: oUseMemo } = React;

// ─── Sparkline ───────────────────────────────────────────
function Sparkline({ data, width = 96, height = 24, stroke = 'var(--ink-2)', fill = 'none', dot = false }) {
  if (!data || !data.length) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max - min) || 1;
  const step = width / (data.length - 1);
  const pts = data.map((v, i) => [i * step, height - ((v - min) / range) * height]);
  const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  return (
    <svg className="sparkline" width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      {fill !== 'none' && (
        <path d={d + ` L${width},${height} L0,${height} Z`} fill={fill} />
      )}
      <path d={d} fill="none" stroke={stroke} strokeWidth="1" />
      {dot && <circle cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="2" fill={stroke} />}
    </svg>
  );
}

// ─── KPI ─────────────────────────────────────────────────
function KPI({ name, value, sub, delta, spark, deltaDir = 'up' }) {
  return (
    <div className="kpi">
      <div className="name">{name}</div>
      <div className="val tnum">{value}</div>
      <div className="flex between center mt-s">
        <div className="sub">

            <span className={deltaDir === 'up' ? 'delta-up' : 'delta-down'}>
              {deltaDir === 'up' ? '▲' : '▼'} {delta}
            </span>
          )}
          {sub ? <span style={{ marginLeft: delta != null ? 8 : 0 }}>{sub}</span> : null}
        </div>
        {spark && <Sparkline data={spark} width={84} height={20} stroke="var(--ochre-deep)" />}
      </div>
    </div>
  );
}

// ─── Globe container ─────────────────────────────────────
function GlobeFrame({ height = 540, style = 'paper', autorotate = true }) {
  const ref = oUseRef(null);
  const globeRef = oUseRef(null);

  oUseEffect(() => {
    if (!ref.current) return;
    const cases = DATA.countries.map(c => ({
      ...c,
      total30: c.total30,
    }));
    const arcs = DATA.routes.map(r => {
      const a = DATA.airports.find(x => x.iata === r[0]);
      const b = DATA.airports.find(x => x.iata === r[1]);
      if (!a || !b) return null;
      const hot = r[2] === 'high';
      return { from: [a.lon, a.lat], to: [b.lon, b.lat], hot, w: r[2] };
    }).filter(Boolean);

    const g = Globe.createGlobe(ref.current, {
      cases, arcs, airports: DATA.airports,
      style, autorotate, showGraticule: true,
    });
    globeRef.current = g;

    const ro = new ResizeObserver(() => g.resize());
    ro.observe(ref.current);

    return () => { ro.disconnect(); g.destroy(); };
  }, [style, autorotate]);

  return (
    <div className="globe-wrap" style={{ height }}>
      <div ref={ref} style={{ width: '100%', height: '100%' }} />
      <div className="globe-overlay tl">
        <div style={{ fontWeight: 600, color: 'var(--ink-3)' }}>FIG. 1 — GLOBAL CASE BURDEN</div>

        <div className="item"><span className="swatch" style={{ background: 'var(--sev-critical)' }} /><span>Critical · &gt;500</span></div>
        <div className="item"><span className="swatch" style={{ background: 'var(--sev-elevated)' }} /><span>Elevated · 100–500</span></div>
        <div className="item"><span className="swatch" style={{ background: 'var(--sev-watch)' }} /><span>Watch · 20–100</span></div>
        <div className="item"><span className="swatch" style={{ background: 'var(--sev-stable)' }} /><span>Stable · &lt;20</span></div>
      </div>
      <div className="globe-overlay bl">
        <div>↻ drag to rotate · auto-rotate resumes after 1.2s</div>

// ─── Reporting-lag confidence chart ─────────────────────
function ReportingConfidence() {
  // Show cases by day with confidence band
  const days = DATA.daily;
  const W = 600, H = 180, M = { t: 16, r: 16, b: 28, l: 36 };
  const w = W - M.l - M.r, h = H - M.t - M.b;
  const max = Math.max(...days.map(d => d.cases)) * 1.2;
  const x = i => M.l + (i / (days.length - 1)) * w;
  const y = v => M.t + h - (v / max) * h;

  const pts = days.map((d, i) => [x(i), y(d.cases)]);
  const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1]).join(' ');
  // Confidence band: widening as we approach today (more lag)
  const upper = days.map((d, i) => [x(i), y(d.cases * (1 + 0.04 + i * 0.008))]);
  const lower = days.map((d, i) => [x(i), y(d.cases * (1 - 0.04 - i * 0.008))]);
  const bandD = upper.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1]).join(' ')
    + ' ' + lower.reverse().map((p, i) => 'L' + p[0] + ',' + p[1]).join(' ') + ' Z';

  return (
    <div className="panel">
      <div className="panel-head">
        <span className="label">Daily incidence · with reporting-lag confidence band</span>
        <span className="sub">95 % CI, lag-adjusted, last 30 days</span>
      </div>
      <div className="panel-body">
        <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
          <g className="chart-grid">
            {[0, 0.25, 0.5, 0.75, 1].map(t => (
              <line key={t} x1={M.l} x2={W - M.r} y1={M.t + t * h} y2={M.t + t * h} />
            ))}
          </g>
          <path d={bandD} fill="rgba(176, 130, 52, 0.18)" />
          <path d={path} fill="none" stroke="var(--ink-2)" strokeWidth="1.4" />
          {pts.filter((_, i) => i % 5 === 0).map(([px, py], i) => (
            <circle key={i} cx={px} cy={py} r="1.6" fill="var(--ink)" />
          ))}
          <g className="chart-axis">
            <line x1={M.l} y1={H - M.b} x2={W - M.r} y2={H - M.b} />
            {[0, 7, 14, 21, 29].map(i => (
              <text key={i} x={x(i)} y={H - M.b + 12} textAnchor="middle">{days[i].date.slice(5)}</text>
            ))}
            {[0, 0.5, 1].map(t => (
              <text key={t} x={M.l - 6} y={M.t + h * (1 - t) + 3} textAnchor="end">
                {Math.round(max * t)}
              </text>
            ))}
          </g>
        </svg>
        <div className="footnote">
          Band represents reconciled 95 % confidence interval for true incidence given jurisdictional lag profile (THL, KDCA, CCDC, CDC, ECDC) and ProMED corroboration.
        </div>
      </div>
    </div>
  );
}
